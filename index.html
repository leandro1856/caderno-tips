<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="noindex, nofollow">
<title>Caderno de Versão TIPS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: caderno de tradutor — faixa de módulo no topo, abas de modo, uma área de trabalho por vez; o texto-fonte sempre em serifa, a resposta em sans */
:root{
  --paper:#F2F4F3; --sheet:#FFFFFF; --ink:#18212B; --muted:#5A6672; --rule:#D5DCDA;
  --seal:#0E6B66; --seal-soft:#DCEDEA; --warn:#9A5B00; --warn-soft:#F6EBD9; --bad:#A3332B; --bad-soft:#F6E1DE; --good:#2E7D3A; --good-soft:#E0F0E2;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11171C; --sheet:#182128; --ink:#E6ECEA; --muted:#97A3AC; --rule:#2B3740;
  --seal:#5CC4BA; --seal-soft:#173733; --warn:#E3A84F; --warn-soft:#3A2D18; --bad:#EC8077; --bad-soft:#3D1F1C; --good:#7BCB86; --good-soft:#1C3420; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11171C; --sheet:#182128; --ink:#E6ECEA; --muted:#97A3AC; --rule:#2B3740;
  --seal:#5CC4BA; --seal-soft:#173733; --warn:#E3A84F; --warn-soft:#3A2D18; --bad:#EC8077; --bad-soft:#3D1F1C; --good:#7BCB86; --good-soft:#1C3420; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body)}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--seal)}
h1{font:600 clamp(26px,5vw,36px)/1.1 var(--f-display);margin:6px 0 0;text-wrap:balance}
.mod{display:flex;flex-direction:column;gap:4px;min-width:0}
.mod label{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;max-width:100%}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 6px}
.stat{font:400 12px var(--f-mono);color:var(--muted)}
.stat b{display:block;font:600 22px/1.2 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin-top:6px;display:flex}
.bar i{display:block;height:100%}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin:22px 0 18px;border-bottom:1px solid var(--rule)}
nav.tabs button{font:500 14px var(--f-body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;margin-bottom:-1px}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--seal)}
.panel{display:flex;flex-direction:column;gap:16px}
.hint{color:var(--muted);font-size:13.5px;margin:0;max-width:65ch}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:20px}
.src{font:400 19px/1.55 var(--f-display);margin:0}
.src em.t{font-style:normal;background:var(--seal-soft);border-radius:3px;padding:0 2px}
.model{font:400 17px/1.55 var(--f-display);font-style:italic;margin:0;border-left:3px solid var(--seal);padding-left:14px}
textarea{width:100%;min-height:120px;resize:vertical;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:500 14px var(--f-body);border-radius:6px;padding:9px 16px;cursor:pointer;border:1px solid var(--rule);background:var(--sheet);color:var(--ink)}
.btn.primary{background:var(--seal);border-color:var(--seal);color:var(--sheet)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn:disabled{opacity:.45;cursor:default}
kbd{font:500 11px var(--f-mono);border:1px solid var(--rule);border-radius:3px;padding:0 4px;color:var(--muted)}
.counter{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.05em}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks small{display:block;color:var(--muted)}
.note{background:var(--warn-soft);border-left:3px solid var(--warn);padding:10px 14px;border-radius:0 6px 6px 0;font-size:14px}
.note b{color:var(--warn);font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
/* flashcard */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;min-height:250px;padding:28px 24px;display:flex;flex-direction:column;gap:12px;justify-content:center;text-align:center;cursor:pointer;position:relative}
.card .box{position:absolute;top:12px;right:14px;font:500 11px var(--f-mono);color:var(--muted)}
.card .front{font:600 clamp(22px,4.5vw,30px)/1.25 var(--f-display);text-wrap:balance}
.card .back{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--rule);padding-top:14px}
.card .ans{font:600 20px/1.3 var(--f-display);color:var(--seal)}
.card .syn{font-size:13.5px;color:var(--muted)}
.card .ex{font:italic 15px/1.45 var(--f-display)}
.card .ex span{display:block;font-style:normal;font-family:var(--f-body);font-size:13px;color:var(--muted)}
.card .note{text-align:left}
.seg{align-self:flex-start;display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{font:500 13px var(--f-body);border:0;background:var(--sheet);color:var(--muted);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--sheet)}
/* quiz */
.q{font:600 22px/1.3 var(--f-display);margin:0;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:400 15px var(--f-body);padding:12px 14px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.feedback{font-size:14px}
.feedback .ex{font:italic 15px var(--f-display)}
.cloze{font:400 19px/1.6 var(--f-display);margin:0}
.cloze .gap{display:inline-block;min-width:7em;border-bottom:2px solid var(--seal);color:var(--seal);font-style:italic}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}
/* glossary */
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--rule)}
th{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--paper);position:sticky;top:0}
td.n{font:400 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
td .pt{font:600 15px var(--f-display)}
td .lv{font:500 11px var(--f-mono);color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.done{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.done .big{font:600 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
@media (max-width:520px){.card{padding:24px 16px}.sheet{padding:16px}}
@media (prefers-reduced-motion:no-preference){.card,.opt,.btn{transition:background-color .15s,border-color .15s}}
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-top:14px}
.filters .mod{flex:1 1 220px}
.filters select{width:100%}
.chip{display:inline-block;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--seal);background:var(--seal-soft);border-radius:3px;padding:2px 6px}
.info{font-size:13.5px;color:var(--muted);text-align:left;border-left:3px solid var(--rule);padding-left:10px}
.notes{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:18px;font-size:14px;max-width:72ch}
details.sheet summary{cursor:pointer;font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--seal)}
details.sheet[open] summary{margin-bottom:10px}
tr.sec td{background:var(--paper);font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--seal)}
.src.en,.model.en{font-style:normal}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>

    <div>

</div>

2,""],["Ações ordinárias / preferenciais","Common shares / Preferred shares","","","","",22,""],["Dividendos / Direitos de voto","Dividends / Voting rights","","","","",22,""],["Conflito de interesses","Conflict of interest","","","","",22,""],["Lavrar / assinar a ata","To draw up / To sign the minutes","","","","",22,""],["Disparar / Saltar","To soar / To surge / To skyrocket","","","","",23,""],["Derreter / Despencar","To plunge / To tumble / To plummet","","","","",23,""],["Elevar / Cortar juros","To hike / To raise vs. To cut / To lower rates","","","","",23,""],["Mercado em alta / em baixa","Bull market / Bear market","","","","",23,""],["Recessão / Recuperação","Downturn / Recession vs. Rebound / Recovery","","","","",23,""],["Projeção / Resultados trimestrais","Guidance / Earnings (call)","","","","",23,""],["Outorgar / Conferir poderes","To grant / To confer / To bestow / To vest with","","","","",24,""],["Nomear / Constituir","To appoint / To constitute","","","","",24,""],["Declarar sob juramento / Atestar","To declare / To attest / To affirm / To depose","","","","",24,""],["Certificar / Dar fé / Reconhecer","To certify / To acknowledge / To authenticate","","","","",24,""],["Revogar / Anular / Tornar nulo","To revoke / To rescind / To annul / To void","","","","",24,""],["Permanecer em pleno vigor","To remain in full force and effect","","","","",24,""]],"paragraphs":[{"pt":"Fica eleito o foro da Comarca de São Paulo, com renúncia expressa a qualquer outro, por mais privilegiado que seja.","en":"The courts of the Judicial District of São Paulo are hereby elected as the exclusive forum for any disputes arising hereunder, with express waiver of any other forum, however privileged it may be.","note":"Observe: \"elected forum / exclusive jurisdiction\" + \"with express waiver\" — fórmula consagrada (Marcílio). Evitar \"chosen court\" (calco).","label":"Versão PT → EN"},{"pt":"O Outorgante nomeia e constitui sua bastante procuradora a Outorgada, outorgando-lhe amplos, gerais e ilimitados poderes para representá-lo perante quaisquer repartições públicas federais, estaduais e municipais.","en":"The Principal hereby appoints and constitutes the above-qualified Attorney-in-Fact as his true and lawful attorney-in-fact, granting her broad, general, and unlimited powers to represent him before any federal, state, and municipal public agencies.","note":"Trio canônico: Principal + Attorney-in-Fact + To grant. \"Broad, general, and unlimited powers\" é a fórmula consagrada em POAs americanas.","label":"Versão PT → EN"},{"pt":"Em fé do que, lavro o presente instrumento, que vai por mim assinado e selado em [cidade], aos [data].","en":"IN WITNESS WHEREOF, I have hereunto set my hand and seal in [city] on [date].","note":"Fórmula canônica de encerramento notarial. Nunca traduzir \"lavro a presente\" literalmente como \"I write the present\".","label":"Versão PT → EN"},{"pt":"Certifico e dou fé, em vista do livro de registro civil sob meu cargo, que do livro nº [X], às folhas [Y], sob nº [Z], consta o assento de nascimento que abaixo transcrevo na íntegra.","en":"I hereby certify and attest, upon inspection of the civil registry book under my custody, that on Book No. [X], page [Y], under No. [Z], the following birth record appears, which I hereby transcribe in full.","note":"Fórmula de inteiro teor. \"I hereby certify and attest\" é mais idiomático que \"I certify and give faith\" (calco).","label":"Versão PT → EN"},{"pt":"As partes, de comum acordo, declaram a dissolução do vínculo conjugal, atribuindo a guarda compartilhada dos filhos menores e estabelecendo, a título de alimentos para os filhos, o valor mensal de [...].","en":"The parties, by mutual agreement, declare the dissolution of their marriage, attributing shared custody (Brazilian CC art. 1.583) of their minor children and establishing, as child support, the monthly amount of [...].","note":"Atenção: \"guarda compartilhada\" ≠ \"shared parental responsibility\" (FL §61.13). Sempre qualificar o destinatário dos alimentos: child support (não apenas \"support\").","label":"Versão PT → EN"},{"pt":"A Parte Receptora obriga-se a não divulgar, durante a vigência deste contrato e pelo prazo de cinco anos após sua extinção, qualquer Informação Confidencial recebida da Parte Divulgadora, sem o consentimento prévio e por escrito desta.","en":"The Receiving Party shall not disclose, during the term of this Agreement and for a period of five years following its termination, any Confidential Information received from the Disclosing Party without the prior written consent of the latter.","note":"\"Receiving Party / Disclosing Party\" são termos consagrados em NDA. \"Prior written consent\" é fórmula clássica.","label":"Versão PT → EN"},{"pt":"Considerando que o Outorgante é o legítimo proprietário do imóvel objeto da presente escritura, livre e desembaraçado de quaisquer ônus, gravames, penhoras ou hipotecas.","en":"WHEREAS the Grantor is the lawful owner of the real property that is the subject matter of this Deed, free and clear of any liens, encumbrances, attachments, or mortgages.","note":"WHEREAS para \"considerando que\" (no preâmbulo). \"Free and clear of liens and encumbrances\" é fórmula consagrada em escrituras americanas.","label":"Versão PT → EN"},{"pt":"Foi deliberado, por unanimidade dos acionistas presentes, o aumento do capital social da Companhia, mediante a emissão de novas ações ordinárias nominativas, com observância do direito de preferência dos atuais acionistas.","en":"It was unanimously resolved by the shareholders present that the Company's capital stock be increased through the issuance of new registered common shares, with due regard for the preemptive right of the current shareholders.","note":"\"It was resolved\" para deliberações em ata. \"Capital stock\" (EUA), nunca \"social capital\". \"Preemptive right\" (em emissão), não \"right of first refusal\" (em venda).","label":"Versão PT → EN"},{"pt":"Eu, ROBERT JAMES MILLER, estando em pleno gozo de minhas faculdades mentais e de memória, e não agindo sob coação, fraude ou influência indevida de qualquer pessoa, faço, publico e declaro o presente instrumento como meu Testamento e Última Vontade.","en":"I, ROBERT JAMES MILLER, being of sound and disposing mind and memory, and not acting under duress, fraud, or undue influence of any person, do hereby make, publish, and declare this instrument to be my Last Will and Testament.","note":"Fórmula consagrada para abertura de testamento. \"Sound and disposing mind\" → \"pleno gozo das faculdades mentais\" é canônico. Evitar \"mente sã\" (informal).","label":"Tradução EN → PT","enfirst":true},{"pt":"SAIBAM quantos esta procuração virem que a abaixo-assinada, JANE ELIZABETH DOE, doravante denominada Outorgante, pelo presente nomeia e constitui MICHAEL JOHN SMITH como seu bastante procurador, outorgando-lhe amplos, gerais e ilimitados poderes.","en":"KNOW ALL PERSONS BY THESE PRESENTS that the undersigned, JANE ELIZABETH DOE, hereinafter referred to as the Principal, does hereby appoint and constitute MICHAEL JOHN SMITH as her true and lawful Attorney-in-Fact, granting him broad, general, and unlimited powers.","note":"Solução de equivalência funcional: a fórmula brasileira \"SAIBAM quantos…\" cumpre, na cultura jurídica BR, o papel de \"KNOW ALL PERSONS BY THESE PRESENTS\". Alternativa: \"POR ESTE INSTRUMENTO, faço saber que…\"","label":"Tradução EN → PT","enfirst":true},{"pt":"CONSIDERANDO que as partes desejam estabelecer os termos e condições que regem a divulgação de informações confidenciais entre elas, RESOLVEM, em vista das obrigações recíprocas aqui estabelecidas, contratar como segue.","en":"WHEREAS the parties wish to set forth the terms and conditions governing the disclosure of confidential information between them, NOW, THEREFORE, in consideration of the mutual covenants set forth herein, the parties agree as follows.","note":"WHEREAS = CONSIDERANDO QUE (nunca \"enquanto\"). \"Mutual covenants\" → \"obrigações recíprocas\" (não \"convênios mútuos\").","label":"Tradução EN → PT","enfirst":true},{"pt":"EM FÉ DO QUE, as partes celebram o presente Contrato por meio de seus representantes devidamente autorizados na data acima indicada.","en":"IN WITNESS WHEREOF, the parties hereto have caused this Agreement to be executed by their duly authorized representatives as of the date first above written.","note":"\"IN WITNESS WHEREOF\" = \"EM FÉ DO QUE\" / \"EM TESTEMUNHO DO QUE\". \"To execute\" em contrato = celebrar / assinar (não \"executar\").","label":"Tradução EN → PT","enfirst":true},{"pt":"O Réu pagará alimentos para os filhos no valor de USD 1.200,00 mensais, devidos no primeiro dia de cada mês civil, até que cada filho menor atinja a maioridade, se torne autossuficiente, ou conclua a educação pós-secundária, o que ocorrer por último.","en":"The Defendant shall pay child support in the amount of $1,200 per month, payable on the first day of each calendar month, until each minor child reaches the age of majority, becomes self- supporting, or completes post-secondary education, whichever occurs later.","note":"CHILD SUPPORT → alimentos para os filhos (qualificar sempre). Evitar \"pagamento de pensão\" (impreciso). Date format: respeitar convenção PT-BR (1.200,00).","label":"Tradução EN → PT","enfirst":true},{"pt":"A Companhia indenizará e isentará de responsabilidade as Partes Indenizadas em relação a toda e qualquer perda, reclamação, dano, responsabilidade, custo e despesa, incluindo honorários advocatícios razoáveis, decorrentes de ou relacionados a qualquer violação das declarações e garantias aqui contidas.","en":"The Company shall indemnify and hold harmless the Indemnified Parties from and against any and all losses, claims, damages, liabilities, costs and expenses, including reasonable attorneys' fees, arising out of or relating to any breach of the representations and warranties contained herein.","note":"Boilerplate clássico: \"indemnify and hold harmless\" → \"indenizar e isentar de responsabilidade\". \"Representations and warranties\" → \"declarações e garantias\" (NUNCA \"representações e garantias\").","label":"Tradução EN → PT","enfirst":true},{"pt":"Não obstante qualquer disposição em contrário contida neste Contrato, nenhuma renúncia a qualquer inadimplemento aqui previsto será considerada como renúncia a qualquer inadimplemento subsequente da mesma ou de qualquer outra disposição.","en":"Notwithstanding any provision to the contrary contained in this Agreement, no waiver of any default hereunder shall be deemed a waiver of any subsequent default of the same or any other provision.","note":"NOTWITHSTANDING → \"não obstante\" / \"independentemente de\". WAIVER → \"renúncia\" (de direito). DEFAULT → \"inadimplemento\" (nunca \"padrão\"). Cláusula \"no waiver\" clássica.","label":"Tradução EN → PT","enfirst":true},{"pt":"O Outorgante, pela quantia de DEZ DÓLARES (USD 10,00) e por outra valiosa e suficiente contraprestação, cujo recebimento e suficiência são neste ato reconhecidos, pelo presente outorga, vende, transfere e transmite ao Outorgado o imóvel a seguir descrito.","en":"The Grantor, for and in consideration of the sum of TEN DOLLARS ($10.00) and other good and valuable consideration, the receipt and sufficiency of which are hereby acknowledged, does hereby grant, bargain, sell, and convey unto the Grantee the following described real property.","note":"Em escritura: GRANTOR / GRANTEE → Outorgante / Outorgado (escritura, não procuração). \"Consideration\" → contraprestação (nunca \"consideração\"). \"Grant, bargain, sell, and convey\" é fórmula de transmissão imobiliária americana.","label":"Tradução EN → PT","enfirst":true}],"notes":["Este material é sobre a PROVA ESCRITA (versão e tradução, 1h30 cada, até 30 linhas, 5 pontos cada; aprovação com 7,00 no total).","Fórmula por questão: AFTO + CGPL − (0,05 × NO1 + 0,10 × NO2). AFTO = fidelidade (até 2,50, qualitativa). CGPL = 2,50 − (erros ÷ linhas escritas).","Com 30 linhas, cada erro gramatical custa 0,0333. Omissão tipo 1 (não prejudica a compreensão) custa 0,05; tipo 2 (prejudica) custa 0,10, o mesmo que 3 erros. Regra: parafrasear é melhor que omitir.","Escreva perto de 30 linhas: com 20 linhas, cada erro custaria 0,05 em vez de 0,0333. Meta realista por questão: AFTO ≈ 2,00, CGPL ≈ 2,20 (até 9 erros), no máximo 1 omissão tipo 2.","Roteiro de cada bloco de 90 min: 5 min de leitura completa; 60 min de primeira passada (dúvidas entre [colchetes], nunca mais de 30 s parado); 15 min de revisão gramatical; 10 min de caça às omissões.","Checklist formal: datas e números no padrão do idioma-alvo (R$ 4.500,00 → BRL 4,500.00); siglas BR + glosa na 1ª ocorrência; shall para obrigação, may para faculdade, shall not para proibição; sem contrações em inglês jurídico.","Checklist terminológico: whereas = considerando que; capital social ≠ social capital; alimentos sempre qualificados; guarda compartilhada ≠ shared parental responsibility; mortgage ≠ alienação fiduciária; notary public ≠ tabelião; premium = o que o segurado paga; officer = diretor executivo, director = conselheiro.","Checklist de omissões: cada parágrafo tem correspondente? Nomes, datas, números e citações de lei estão todos lá? Expressões como \"nos termos de\" e \"sem prejuízo de\" não foram puladas? Listas de poderes, cláusulas e bens estão completas?","Formato: [Coat of Arms], [Signed], [Seal], [Stamp], [Barcode] entre colchetes; termo sem equivalente leva glosa direta na 1ª ocorrência, ex.: \"CPF [Individual Taxpayer Registry]\".","Mapa da procuração: KNOW ALL PERSONS BY THESE PRESENTS → qualificação do Principal e do Attorney-in-Fact → \"hereby appoints and constitutes… granting broad, general, and unlimited powers\" → poderes numerados → prazo e revogação → foro → data, assinatura, testemunhas.","Mapa da certidão de inteiro teor: \"I hereby certify and attest that… upon review of Book X, page Y, under No. Z, the following record appears, which I hereby transcribe in full.\"","Balanço: Ativo = Passivo + PL → Assets = Liabilities + Equity. DRE: Gross revenue → Net revenue → Gross profit → Operating income → EBT → Net income.","No quiz de 60 questões, a questão 29 (deed) tem um erro no gabarito da apostila; usei a resposta coerente com a própria apostila."],"mcq":[{"n":1,"q":"Substabelecimento (de procuração) deve ser traduzido como:","opts":["Transfer of attorney","Substitution of attorney / Power of substitution","Replacement of mandate","Subdelegation of powers"],"ans":1,"block":"Conflitos terminológicos","note":""},{"n":2,"q":"\"Tabelião de Notas\" em tradução juramentada PT→EN deve ser:","opts":["Notary Public","Public Notary","Civil-law notary (Tabelião de Notas)","Notary Officer"],"ans":2,"block":"Conflitos terminológicos","note":""},{"n":3,"q":"Em uma POA americana, o outorgante é o:","opts":["Grantor","Principal","Settlor","Donor"],"ans":1,"block":"Conflitos terminológicos","note":""},{"n":4,"q":"Em uma escritura imobiliária brasileira (compra e venda), o outorgante deve ser traduzido como:","opts":["Principal","Donor-Seller","Grantor (ou Grantor-Seller)","Mandatary"],"ans":2,"block":"Conflitos terminológicos","note":""},{"n":5,"q":"Capital social deve ser traduzido para o inglês americano como:","opts":["Social capital","Capital stock","Share capital","Corporate capital"],"ans":1,"block":"Conflitos terminológicos","note":""},{"n":6,"q":"Capital integralizado em inglês americano é:","opts":["Integrated capital","Paid-up capital","Paid-in capital","Fully-realized capital"],"ans":2,"block":"Conflitos terminológicos","note":""},{"n":7,"q":"\"Inventariante (com testamento)\" deve ser traduzido como:","opts":["Inventor","Executor / Personal Representative","Administrator","Probate officer"],"ans":1,"block":"Conflitos terminológicos","note":""},{"n":8,"q":"\"Alienação fiduciária de imóvel\" deve ser traduzida como:","opts":["Mortgage","Lien","Fiduciary transfer / Deed of trust","Foreclosure"],"ans":2,"block":"Conflitos terminológicos","note":""},{"n":9,"q":"\"Guarda compartilhada\" (CC art. 1.583) em tradução PT→EN é:","opts":["Joint custody","Shared parental responsibility","Shared custody","Co-parenting"],"ans":2,"block":"Conflitos terminológicos","note":""},{"n":10,"q":"\"Alimentos para os filhos\" deve ser traduzido como:","opts":["Food allowance","Child support","Spousal support","Maintenance"],"ans":1,"block":"Conflitos terminológicos","note":""},{"n":11,"q":"\"Foro eleito\" em cláusula contratual é:","opts":["Chosen court","Elected forum / Exclusive jurisdiction","Selected venue","Forum non conveniens"],"ans":1,"block":"Conflitos terminológicos","note":""},{"n":12,"q":"A sigla CPF em tradução juramentada deve aparecer como:","opts":["Apenas \"Individual Taxpayer Number\"","CPF [Individual Taxpayer Registry]","Brazilian Tax ID","CPF apenas, sem glosa"],"ans":1,"block":"Conflitos terminológicos","note":""},{"n":13,"q":"\"Considerando que\" no preâmbulo de contratos é:","opts":["While","Whereas","Considering that","Inasmuch as"],"ans":1,"block":"Conflitos terminológicos","note":""},{"n":14,"q":"\"Em fé do que\" é:","opts":["In faith of which","In witness whereof","For all due purposes","Hereby attested"],"ans":1,"block":"Conflitos terminológicos","note":""},{"n":15,"q":"\"Direito de preferência (em emissão de ações)\" é:","opts":["Right of first refusal","Preemptive right","Priority right","First option right"],"ans":1,"block":"Conflitos terminológicos","note":""},{"n":16,"q":"\"Actual damages\" em sentença judicial significa:","opts":["Danos atuais","Danos reais / efetivos","Danos punitivos","Danos presumidos"],"ans":1,"block":"Falsos cognatos","note":""},{"n":17,"q":"\"Injury\" em contexto de responsabilidade civil é:","opts":["Injúria (ofensa verbal)","Lesão / dano","Insulto","Difamação"],"ans":1,"block":"Falsos cognatos","note":""},{"n":18,"q":"\"Conviction\" em sentença criminal é:","opts":["Convicção","Condenação criminal","Acusação","Pena" ":2,"block":"Falsos cognatos","note":""},{"n":29,"q":"\"Deed\" em direito imobiliário é:","opts":["Dever","Ato jurídico","Escritura pública","Tarefa contratual"],"ans":2,"block":"Falsos cognatos","note":"O gabarito da apostila marca B, mas a própria apostila (falsos cognatos, bloco D) define deed como escritura pública. Considerei C."},{"n":30,"q":"\"Trade secret\" em propriedade intelectual é:","opts":["Segredo de mercado","Segredo de negócio / industrial","Pacto de não concorrência","Cláusula de confidencialidade"],"ans":1,"block":"Falsos cognatos","note":""},{"n":31,"q":"\"SAIBAM quantos esta Escritura virem que…\" é a fórmula tradicional para:","opts":["BE IT KNOWN that…","KNOW ALL PERSONS BY THESE PRESENTS that…","TO WHOM IT MAY CONCERN…","WITNESS the following…"],"ans":1,"block":"Fórmulas notariais e registro solene","note":""},{"n":32,"q":"\"Em fé do que, lavro a presente\" corresponde a:","opts":["In good faith, I draw the present","IN WITNESS WHEREOF, I have hereunto set my hand","In faith of which I write the present","For the record, I sign hereunder"],"ans":1,"block":"Fórmulas notariais e registro solene","note":""},{"n":33,"q":"\"Certifico e dou fé que…\" corresponde a:","opts":["I attest and declare that…","I hereby certify and attest that…","I confirm and confess that…","I swear and affirm that…"],"ans":1,"block":"Fórmulas notariais e registro solene","note":""},{"n":34,"q":"\"Termos em que pede deferimento\" em petição judicial é:","opts":["Under these terms, the petitioner requests","WHEREFORE, the Petitioner respectfully requests","In these terms, deferral is requested","Pursuant to which approval is sought"],"ans":1,"block":"Fórmulas notariais e registro solene","note":""},{"n":35,"q":"\"Nada mais consta\" no encerramento de assento é:","opts":["Nothing else exists","No further information","Nothing further appears / Nothing further is recorded","No additional records found"],"ans":2,"block":"Fórmulas notariais e registro solene","note":""},{"n":3

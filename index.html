laim of nullity rejected.","Preliminar de nulidade afastada.","",6,""],["auto de lançamento nulo","void tax assessment notice","","","","",6,""],["matéria tributável","taxable subject matter","","The preliminary claim that the tax assessment notice was null and void due to an alleged failure to determine the taxable subject matter adequately (Article 142 of the National Tax Code) was rejected.","Preliminar de nulidade do auto de lançamento, fundada em suposta deficiência na determinação da matéria tributável (art. 142 do CTN), afastada.","",6,""],["sujeito passivo","person liable for the tax; taxpayer","","The assessment meets the validity requirements of Article 142 of the National Tax Code and Article 17 of Law No. 6,537/1973, identifying the person liable for the tax, the taxable event, the taxable subject matter, the applicable legal provisions and the amount of the tax claim.","O ato satisfaz os requisitos de validade dos arts. 142 do CTN e 17 da Lei nº 6.537/73, identificando o sujeito passivo, o fato gerador, a matéria tributável, a capitulação legal e o montante do crédito.","",6,""],["capitulação legal","applicable legal provisions; legal classification","","The assessment meets the validity requirements of Article 142 of the National Tax Code and Article 17 of Law No. 6,537/1973, identifying the person liable for the tax, the taxable event, the taxable subject matter, the applicable legal provisions and the amount of the tax claim.","O ato satisfaz os requisitos de validade dos arts. 142 do CTN e 17 da Lei nº 6.537/73, identificando o sujeito passivo, o fato gerador, a matéria tributável, a capitulação legal e o montante do crédito.","",6,""],["montante do crédito","amount of the tax claim","","The assessment meets the validity requirements of Article 142 of the National Tax Code and Article 17 of Law No. 6,537/1973, identifying the person liable for the tax, the taxable event, the taxable subject matter, the applicable legal provisions and the amount of the tax claim.","O ato satisfaz os requisitos de validade dos arts. 142 do CTN e 17 da Lei nº 6.537/73, identificando o sujeito passivo, o fato gerador, a matéria tributável, a capitulação legal e o montante do crédito.","",6,""],["matéria de mérito","issue on the merits","","Disagreement over the applicable tax rate is an issue on the merits, not a formal defect.","A divergência quanto à alíquota aplicável é matéria de mérito, não vício formal.","",6,""],["vício formal","formal defect","","Disagreement over the applicable tax rate is an issue on the merits, not a formal defect.","A divergência quanto à alíquota aplicável é matéria de mérito, não vício formal.","",6,""],["mercadorias arroladas","goods expressly listed","","","","",6,""],["não se enquadram","do not fall within the scope","","","","",6,""],["interpretação extensiva","expansive interpretation","","","","",6,""],["interpretação analógica","interpretation by analogy","","","","",6,""],["matéria-prima vegetal moída","ground plant-based raw material","","","","",6,""],["seletividade","selectivity (in taxation)","","Selectivity and essentiality.","Seletividade e essencialidade.","",6,""],["essencialidade","essentiality / essential nature of goods","","Selectivity and essentiality.","Seletividade e essencialidade.","",6,""],["afastamento da alíquota","disapplication of the tax rate","","","","",6,""],["controle de constitucionalidade","constitutional review","","Prohibition on constitutional review at the administrative level (Precedent Statement No. 03 of TARF/RS).","Vedação ao controle de constitucionalidade na esfera administrativa (Súmula nº 03 do TARF/RS).","",6,""],["esfera administrativa","administrative sphere / level","","Prohibition on constitutional review at the administrative level (Precedent Statement No. 03 of TARF/RS).","Vedação ao controle de constitucionalidade na esfera administrativa (Súmula nº 03 do TARF/RS).","",6,""],["súmula","precedent statement","","Prohibition on constitutional review at the administrative level (Precedent Statement No. 03 of TARF/RS).","Vedação ao controle de constitucionalidade na esfera administrativa (Súmula nº 03 do TARF/RS).","",6,""],["legislador positivo","positive legislator","","","","",6,""],["multa mantida","penalty upheld","","","","",6,""],["infração material básica","basic substantive tax violation","","The 60% penalty is upheld because the conduct constitutes a basic substantive tax violation (Articles 7(III) and 9(II) of Law No. 6,537/1973).","Multa de 60% mantida, por se tratar de infração material básica (arts. 7º, III, e 9º, II, da Lei nº 6.537/73).","",6,""],["por unanimidade","unanimously","","The panel unanimously rejected the preliminary claim and, on the merits, dismissed the voluntary administrative appeal.","Por unanimidade, rejeitaram a preliminar, e, no mérito, negaram provimento ao Recurso Voluntário.","",6,""],["negar provimento ao recurso","dismiss / deny the appeal","","Having examined, reported on and deliberated upon the case file, the members of the First Chamber of the Administrative Tax Appeals Tribunal of Rio Grande do Sul UNANIMOUSLY DECIDE to reject the preliminary claim and, on the merits, dismiss the voluntary administrative appeal.","Vistos, relatados e discutidos estes autos, ACORDAM os membros da Primeira Câmara do Tribunal Administrativo de Recursos Fiscais do Rio Grande do Sul, por UNANIMIDADE, em rejeitar a preliminar, e, no mérito, em negar provimento ao Recurso Voluntário.","",6,""],["juiz relator","reporting judge","","Fábio Raimundi – Reporting Judge.","Fábio Raimundi – Juiz Relator.","",6,""],["presidente da câmara","presiding judge of the chamber","","Carlos Tocchetto – Presiding Judge of the Chamber.","Carlos Tocchetto – Presidente da Câmara.","",6,""],["defensor da Fazenda","State Treasury counsel","","State Treasury Counsel Luiz Ary Soares Gallechio and Augusto Ernesto Timm Neto were present.","Presentes os Defensores da Fazenda, Luiz Ary Soares Gallechio e Augusto Ernesto Timm Neto.","",6,""],["interpor recurso","file / lodge an appeal","","Having examined, reported on and deliberated upon the case file, the members of the First Chamber of the Administrative Tax Appeals Tribunal of Rio Grande do Sul UNANIMOUSLY DECIDE to reject the preliminary claim and, on the merits, dismiss the voluntary administrative appeal.","Vistos, relatados e discutidos estes autos, ACORDAM os membros da Primeira Câmara do Tribunal Administrativo de Recursos Fiscais do Rio Grande do Sul, por UNANIMIDADE, em rejeitar a preliminar, e, no mérito, em negar provimento ao Recurso Voluntário.","",6,""],["CTN","National Tax Code","","Strict interpretation of the exception (Article 111 of the National Tax Code).","Interpretação literal da norma de exceção (art. 111 do CTN).","",6,""],["RICMS","ICMS Regulations","","Non-applicability of the exception provided for in Article 12(II)(a)(4) of Law No. 8,820/1989 and item IV of Section I of Appendix I to the ICMS Regulations.","Inaplicabilidade da exceção prevista no art. 12, II, “a”, item 4, da Lei nº 8.820/89 e no item IV da Seção I do Apêndice I do RICMS.","",6,""],["apêndice / seção / item","appendix / section / item","","Non-applicability of the exception provided for in Article 12(II)(a)(4) of Law No. 8,820/1989 and item IV of Section I of Appendix I to the ICMS Regulations.","Inaplicabilidade da exceção prevista no art. 12, II, “a”, item 4, da Lei nº 8.820/89 e no item IV da Seção I do Apêndice I do RICMS.","",6,""],["instrumento particular","private instrument / private agreement","","","","",7,""],["protocolo e justificação","protocol and justification / merger protocol and justification","","","","",7,""],["não consumação da operação","non-consummation of the transaction","","","","",7,""],["condições suspensivas","conditions precedent","","","","",7,""],["data de implemento","date of satisfaction (of the conditions)","","","","",7,""],["descumprimento","breach / failure to perform","","","","",7,""],["adimplemento","performance / fulfillment","","","","",7,""],["data de fechamento","closing date","","","","",7,""],["suspender o cumprimento","suspend performance","","","","",7,""],["de pleno direito","by operation of law","","","","",7,""],["sem formalidade adicional","without any further formality","","","","",7,""],["aumento de capital","capital increase","","","","",7,""],["incorporação de ações","share incorporation (Brazilian corporate-law transaction)","","","","",7,""],["resgate de ações","share redemption","","","","",7,""],["incorporação da holding","merger by absorption of the holding company","","","","",7,""],["distrato","mutual termination agreement","","","","",7,""],["data limite","long-stop date / outside date","","","","",7,""],["parte inocente","non-breaching party","","","","",7,""],["parte infratora","breaching party","","","","",7,""],["declarações e garantias","representations and warranties","","","","",7,""],["purgação / saneamento","cure / remedy","","","","",7,""],["notificação de descumprimento","notice of breach","","","","",7,""],["prazo de 30 dias","30-day cure period","","","","",7,""]],"paragraphs":[{"pt":"Acórdão nº 375/26; Recurso nº 1141/25; Recorrente: Companhia Zaffari Comércio e Indústria; Recorrida: Fazenda Estadual; Processo nº 25/1404-0031833-6; Auto de lançamento nº 0055836941; Decisão de 1ª instância nº 1522250131.","en":"Panel Decision No. 375/26; Appeal No. 1141/25; Appellant: Companhia Zaffari Comércio e Indústria; Respondent: State Treasury; Case No. 25/1404-0031833-6; Tax Assessment Notice No. 0055836941; First-Instance Decision No. 1522250131.","label":"Acórdão TARF/RS","note":"Tradução-modelo da apostila (proposta de estudo, não tradução juramentada)."},{"pt":"Recurso voluntário. ICMS. Operações internas com bebidas vegetais (à base de aveia, arroz, amêndoa, castanha, coco e demais vegetais, exceto soja ou leite). Classificação fiscal e alíquota. Inaplicabilidade da exceção prevista no art. 12, II, “a”, item 4, da Lei nº 8.820/89 e no item IV da Seção I do Apêndice I do RICMS. Interpretação literal da norma de exceção (art. 111 do CTN). Preliminar de nulidade afastada. Seletividade e essencialidade. Vedação ao controle de constitucionalidade na esfera administrativa (Súmula nº 03 do TARF/RS).","en":"Voluntary administrative appeal. ICMS (Brazilian state tax on the circulation of goods and certain services). Intrastate transactions involving plant-based beverages (made from oats, rice, almonds, nuts, coconut and other plant ingredients, excluding soy or milk). Tax classification and tax rate. Non-applicability of the exception provided for in Article 12(II)(a)(4) of Law No. 8,820/1989 and item IV of Section I of Appendix I to the ICMS Regulations. Strict interpretation of the exception (Article 111 of the National Tax Code). Preliminary claim of nullity rejected. Selectivity and essentiality. Prohibition on constitutional review at the administrative level (Precedent Statement No. 03 of TARF/RS).","label":"Acórdão TARF/RS","note":"Tradução-modelo da apostila (proposta de estudo, não tradução juramentada)."},{"pt":"Preliminar de nulidade do auto de lançamento, fundada em suposta deficiência na determinação da matéria tributável (art. 142 do CTN), afastada. O ato satisfaz os requisitos de validade dos arts. 142 do CTN e 17 da Lei nº 6.537/73, identificando o sujeito passivo, o fato gerador, a matéria tributável, a capitulação legal e o montante do crédito. A divergência quanto à alíquota aplicável é matéria de mérito, não vício formal.","en":"The preliminary claim that the tax assessment notice was null and void due to an alleged failure to determine the taxable subject matter adequately (Article 142 of the National Tax Code) was rejected. The assessment meets the validity requirements of Article 142 of the National Tax Code and Article 17 of Law No. 6,537/1973, identifying the person liable for the tax, the taxable event, the taxable subject matter, the applicable legal provisions and the amount of the tax claim. Disagreement over the applicable tax rate is an issue on the merits, not a formal defect.","label":"Acórdão TARF/RS","note":"Tradução-modelo da apostila (proposta de estudo, não tradução juramentada)."},{"pt":"No mérito, a alíquota interna geral incidente sobre as operações com bebidas é de 25% (art. 27, I, do Livro I, e item IV da Seção I do Apêndice I do RICMS; art. 12, II, “a”, item 4, da Lei nº 8.820/89), constituindo exceções, tributadas à alíquota inferior, apenas as mercadorias expressamente arroladas no preceito, entre as quais as “bebidas alimentares à base de soja ou de leite”.","en":"On the merits, the general intrastate tax rate applicable to transactions involving beverages is 25% (Article 27(I) of Book I and item IV of Section I of Appendix I to the ICMS Regulations; Article 12(II)(a)(4) of Law No. 8,820/1989). Only goods expressly listed in the provision qualify for exceptions subject to a lower tax rate, including “nutritional beverages made from soy or milk”.","label":"Acórdão TARF/RS","note":"Tradução-modelo da apostila (proposta de estudo, não tradução juramentada)."},{"pt":"As bebidas vegetais elaboradas a partir de aveia, arroz, amêndoa, castanha, coco e outros vegetais, que não a soja, não se enquadram nas exceções legais e permanecem sujeitas à alíquota de 25%. A norma de exceção interpreta-se literalmente (art. 111 do CTN), sendo vedada a interpretação extensiva ou analógica para alcançar hipótese não contemplada pelo legislador.","en":"Plant-based beverages made from oats, rice, almonds, nuts, coconut and plant ingredients other than soy do not fall within the statutory exceptions and remain subject to the 25% tax rate. The exception must be interpreted strictly (Article 111 of the National Tax Code); an expansive or analogical interpretation cannot be used to cover situations not contemplated by the legislature.","label":"Acórdão TARF/RS","note":"Tradução-modelo da apostila (proposta de estudo, não tradução juramentada)."},{"pt":"Tais bebidas tampouco se qualificam como “sucos”, “néctares” ou “bebidas de fruta” (Decreto Federal nº 6.871/09, arts. 18, 21 e 22), porque resultam da diluição em água de farinha ou de matéria-prima vegetal moída, e não de extrato, polpa ou suco da fruta.","en":"Nor do such beverages qualify as “juices”, “nectars” or “fruit beverages” (Federal Decree No. 6,871/2009, Articles 18, 21 and 22), because they are produced by diluting flour or ground plant-based raw materials in water, rather than from fruit extract, pulp or juice.","label":"Acórdão TARF/RS","note":"Tradução-modelo da apostila (proposta de estudo, não tradução juramentada)."},{"pt":"A pretensão de afastamento da alíquota legal sob fundamento de violação à seletividade e à essencialidade (art. 155, § 2º, III, da CF; art. 145, § 4º, da Constituição Estadual; RE 714139/SC – Tema 745) não comporta exame nesta instância, ante a vedação ao controle de constitucionalidade da norma estadual (Súmula nº 03 do TARF/RS), não cabendo ao julgador administrativo atuar como legislador positivo.","en":"The request to disapply the statutory tax rate on the grounds that it violates the principles of selectivity and essentiality (Article 155(2)(III) of the Federal Constitution; Article 145(4) of the State Constitution; Extraordinary Appeal No. 714139/SC – Theme 745) cannot be examined at this level of administrative review, given the prohibition on constitutional review of state legislation (Precedent Statement No. 03 of TARF/RS). It is not for the administrative adjudicator to act as a positive legislator.","label":"Acórdão TARF/RS","note":"Tradução-modelo da apostila (proposta de estudo, não tradução juramentada)."},{"pt":"Multa de 60% mantida, por se tratar de infração material básica (arts. 7º, III, e 9º, II, da Lei nº 6.537/73).","en":"The 60% penalty is upheld because the conduct constitutes a basic substantive tax violation (Articles 7(III) and 9(II) of Law No. 6,537/1973).","label":"Acórdão TARF/RS","note":"Tradução-modelo da apostila (proposta de estudo, não tradução juramentada)."},{"pt":"Por unanimidade, rejeitaram a preliminar, e, no mérito, negaram provimento ao Recurso Voluntário.","en":"The panel unanimously rejected the preliminary claim and, on the merits, dismissed the voluntary administrative appeal.","label":"Acórdão TARF/RS","note":"Tradução-modelo da apostila (proposta de estudo, não tradução juramentada)."},{"pt":"ACÓRDÃO. Vistos, relatados e discutidos estes autos, ACORDAM os membros da Primeira Câmara do Tribunal Administrativo de Recursos Fiscais do Rio Grande do Sul, por UNANIMIDADE, em rejeitar a preliminar, e, no mérito, em negar provimento ao Recurso Voluntário.","en":"DECISION. Having examined, reported on and deliberated upon the case file, the members of the First Chamber of the Administrative Tax Appeals Tribunal of Rio Grande do Sul UNANIMOUSLY DECIDE to reject the preliminary claim and, on the merits, dismiss the voluntary administrative appeal.","label":"Acórdão TARF/RS","note":"Tradução-modelo da apostila (proposta de estudo, não tradução juramentada)."},{"pt":"Participaram do julgamento, ainda, os Juízes Rodrigo Maciel de Souza, Eduardo Rosa Franco e Luciano Coelho Guimarães. Presentes os Defensores da Fazenda, Luiz Ary Soares Gallechio e Augusto Ernesto Timm Neto.","en":"Judges Rodrigo Maciel de Souza, Eduardo Rosa Franco and Luciano Coelho Guimarães also took part in the proceedings. State Treasury Counsel Luiz Ary Soares Gallechio and Augusto Ernesto Timm Neto were present.","label":"Acórdão TARF/RS","note":"Tradução-modelo da apostila (proposta de estudo, não tradução juramentada)."},{"pt":"Porto Alegre, 10 de junho de 2026. Fábio Raimundi – Juiz Relator. Carlos Tocchetto – Presidente da Câmara. RELATÓRIO. Trata-se de recurso voluntário interposto por Companhia Zaffari Comércio e Indústria [...]","en":"Porto Alegre, June 10, 2026. Fábio Raimundi – Reporting Judge. Carlos Tocchetto – Presiding Judge of the Chamber. REPORT. This is a voluntary administrative appeal filed by Companhia Zaffari Comércio e Indústria [...]","label":"Acórdão TARF/RS","note":"Tradução-modelo da apostila (proposta de estudo, não tradução juramentada)."},{"pt":"A redução da base de cálculo não se aplica às operações internas.","en":"The reduction of the tax base does not apply to intrastate transactions.","label":"Minissimulado","note":"A apostila não traz resposta; modelo feito por Claude. Conhecer o recurso = admit/hear the appeal; dar provimento = grant/uphold."},{"pt":"O recurso foi conhecido e parcialmente provido.","en":"The appeal was admitted and partially granted.","label":"Minissimulado","note":"A apostila não traz resposta; modelo feito por Claude. Conhecer o recurso = admit/hear the appeal; dar provimento = grant/uphold."},{"pt":"A portaria foi publicada no Diário Oficial da União.","en":"The ordinance was published in the Federal Official Gazette (Diário Oficial da União).","label":"Minissimulado","note":"A apostila não traz resposta; modelo feito por Claude. Conhecer o recurso = admit/hear the appeal; dar provimento = grant/uphold."},{"pt":"A mercadoria enquadra-se na classificação fiscal indicada.","en":"The goods fall within the indicated tax classification.","label":"Minissimulado","note":"A apostila não traz resposta; modelo feito por Claude. Conhecer o recurso = admit/hear the appeal; dar provimento = grant/uphold."},{"pt":"O relator rejeitou a preliminar e examinou o mérito.","en":"The reporting judge rejected the preliminary claim and examined the merits.","label":"Minissimulado","note":"A apostila não traz resposta; modelo feito por Claude. Conhecer o recurso = admit/hear the appeal; dar provimento = grant/uphold."},{"pt":"Justifique em inglês: “Acórdão” → panel decision","en":"I chose “panel decision” to make clear that this is a collegiate decision. “Judgment” is also possible, but may suggest a judicial court rather than an administrative tribunal.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Recurso voluntário” → voluntary administrative appeal","en":"I retained “voluntary” because it distinguishes this procedural remedy from mandatory review in Brazilian administrative practice.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Recorrente” → appellant","en":"“Appellant” identifies the party bringing the appeal and is a conventional functional equivalent.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Recorrida” → respondent","en":"I chose “respondent” because the State Treasury is the party responding to the administrative appeal.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Auto de lançamento” → tax assessment notice","en":"This conveys the function of the Brazilian instrument rather than translating “auto” literally as “record”.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Fato gerador” → taxable event","en":"“Taxable event” expresses the event that triggers tax liability, unlike the literal “generating fact”.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Sujeito passivo” → person liable for the tax","en":"This is more precise than “passive subject”, which would be unnatural in English.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Matéria tributável” → taxable subject matter","en":"The phrase preserves the distinction between what is taxed and the amount of tax assessed.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Crédito tributário” → tax claim","en":"I used “tax claim” to refer to the tax authority’s enforceable claim, rather than a taxpayer credit.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Alíquota” → tax rate","en":"“Tax rate” is the established term for the percentage applied to the relevant tax base.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Operações internas” → intrastate transactions","en":"“Intrastate” makes the Brazilian state-level scope explicit; “domestic” could be understood as nationwide.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Norma de exceção” → statutory exception","en":"This indicates a legal exception to the general rule, not an exceptional or unusual norm.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Interpretação literal” → strict interpretation","en":"I chose “strict interpretation” to convey the narrow reading of tax exceptions in this context; “literal interpretation” is also defensible.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Preliminar de nulidade” → preliminary claim of nullity","en":"The wording captures a procedural argument considered before the substantive merits.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Vício formal” → formal defect","en":"This refers to a defect in form or procedure, as distinct from a disagreement over the applicable rate.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Negar provimento” → dismiss the appeal","en":"“Dismiss the appeal” is idiomatic legal English and avoids the false literal translation “deny provision”.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Controle de constitucionalidade” → constitutional review","en":"This is a recognized functional equivalent for assessing whether legislation complies with a constitution.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Súmula” → precedent statement","en":"I avoided “summary” because a súmula states a consolidated legal position rather than merely summarizing a document.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Seletividade e essencialidade” → selectivity and essentiality","en":"I preserved the technical constitutional concepts and would explain their meaning if asked by the examiners.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês: “Juiz relator” → reporting judge","en":"This retains the reporting role in the collegiate body; “rapporteur” is another possible translation in comparative legal contexts.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês a escolha: Tax substitution regime","en":"I retained the Brazilian tax-law concept instead of replacing it with an apparently similar foreign tax mechanism. This preserves institutional accuracy.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês a escolha: ICMS / state-level VAT","en":"I kept the original acronym and added a functional explanation, since ICMS has no exact one-to-one equivalent in English-speaking jurisdictions.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês a escolha: Intrastate transactions","en":"I chose “intrastate” rather than “domestic” because the relevant distinction under Brazilian ICMS rules is within the same state.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês a escolha: Tax base","en":"I used “tax base” for concision and terminological accuracy; “calculation base” is understandable but less idiomatic.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês a escolha: Falls within the scope of","en":"I chose this expression to convey legal applicability, rather than a literal translation of “enquadra-se”.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês a escolha: Headnote / summary","en":"I used “headnote” when referring to the concise summary preceding a court judgment; for administrative tax opinions, “summary” may be more neutral.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês a escolha: Appellate court judgment","en":"I used a descriptive functional equivalent for “acórdão”, because the Brazilian collegiate decision is not identical to every common-law judgment.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês a escolha: Motion for clarification","en":"I avoided a literal rendering of “embargos de declaração” and described its procedural purpose.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês a escolha: Pursuant to","en":"I selected “pursuant to” to reflect a formal legal reference to the governing provision.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês a escolha: Ordinance / administrative order","en":"I chose the equivalent according to the issuing authority and context, because “portaria” does not always correspond to an English-language ordinance.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês a escolha: Public Prosecution Service","en":"I avoided translating “Ministério Público” as “Public Ministry”, which may mislead English-speaking readers.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês a escolha: Sworn translation","en":"I used the established functional term while retaining the Brazilian institutional context, rather than assuming identical certification systems.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês a escolha: Ministry of Entrepreneurship, Microenterprise and Small Business","en":"I rendered the institutional name descriptively and retained all three areas of competence, without implying that the translation is an official English title.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês a escolha: Rescission / termination","en":"I distinguished the legal effect: termination ends a contract, while rescission may refer to setting it aside, depending on the legal system.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês a escolha: Letter rogatory","en":"I chose the conventional international judicial-cooperation term, while “letter of request” may be preferable in some treaty frameworks.","label":"Arguição","oneway":true},{"pt":"Justifique em inglês a escolha: Conditions precedent","en":"I used “conditions precedent” because it is the established contractual term for conditions that must be satisfied before the transaction proceeds.","label":"Arguição (M&A)","oneway":true},{"pt":"Justifique em inglês a escolha: Closing Date","en":"“Closing Date” is standard terminology for the date on which a corporate transaction is completed.","label":"Arguição (M&A)","oneway":true},{"pt":"Justifique em inglês a escolha: Breach","en":"“Breach” expresses non-compliance with a contractual obligation more precisely than a generic “failure”.","label":"Arguição (M&A)","oneway":true},{"pt":"Justifique em inglês a escolha: Suspend performance","en":"I chose “suspend performance” to convey the temporary withholding of contractual obligations.","label":"Arguição (M&A)","oneway":true},{"pt":"Justifique em inglês a escolha: By operation of law","en":"This expression conveys an automatic legal effect without further action or formalities.","label":"Arguição (M&A)","oneway":true},{"pt":"Justifique em inglês a escolha: Long-Stop Date","en":"In M&A practice, this refers to the ultimate deadline for completing a transaction.","label":"Arguição (M&A)","oneway":true},{"pt":"Justifique em inglês a escolha: Non-breaching party","en":"This term identifies the party that has not violated the contractual obligations.","label":"Arguição (M&A)","oneway":true},{"pt":"Justifique em inglês a escolha: Representations and warranties","en":"This is a conventional paired expression in English-language corporate agreements.","label":"Arguição (M&A)","oneway":true},{"pt":"Justifique em inglês a escolha: Cure a breach","en":"“Cure” is a technical contractual verb meaning to correct a breach within an allowed period.","label":"Arguição (M&A)","oneway":true},{"pt":"Justifique em inglês a escolha: Notice of breach","en":"This is a concise and established term for a formal notification of contractual non-compliance.","label":"Arguição (M&A)","oneway":true},{"pt":"Justifique em inglês a escolha: Share incorporation","en":"I retained a term close to the Brazilian legal concept to avoid equating it automatically with an Anglo-American merger.","label":"Arguição (M&A)","oneway":true},{"pt":"Justifique em inglês a escolha: Merger by absorption","en":"This conveys the absorption of one company by another, subject to the legal structure described in the agreement.","label":"Arguição (M&A)","oneway":true},{"pt":"Justifique em inglês a escolha: Share redemption","en":"“Redemption” refers to the company’s redemption of shares under the relevant legal or contractual mechanism.","label":"Arguição (M&A)","oneway":true},{"pt":"Justifique em inglês a escolha: Mutual termination agreement","en":"This reflects termination by agreement of both parties rather than unilateral rescission.","label":"Arguição (M&A)","oneway":true},{"pt":"Justifique em inglês a escolha: Pursuant to Article 476","en":"“Pursuant to” is a conventional legal way to identify the statutory basis for the contractual right.","label":"Arguição (M&A)","oneway":true}],"notes":["A apostila foi montada a partir de relatos de candidatos e de um acórdão do TARF/RS (ICMS sobre bebidas vegetais). Ela mesma avisa que isso não permite prever os textos da prova.","Prioridade alta segundo a apostila: acórdãos e decisões, administração pública, tributação, tradução funcional de institutos brasileiros.","Estrutura para justificar qualquer escolha: Identify the text type and target audience: “This is a formal legal/administrative text addressed to professionals.” Explain the semantic function: “The term refers to a specific Brazilian legal institution.” State the strategy: “I used a functional equivalent / descriptive translation / borrowing with explanation.” Defend precision and register: “This choice preserves legal meaning and maintains an appropriate formal register.”","Perguntas de treino sem resposta-modelo: Why did you translate “operações internas” as “intrastate transactions”? | What is the difference between a tax assessment and a tax liability? | Why is “fato gerador” not “generating fact”? | How would you explain the role of the TARF/RS to a foreign audience? | What is the difference between an appeal being dismissed and a preliminary claim being rejected? | Would you translate “súmula” as “binding precedent” in every case? | How does the register of a tax ruling affect your lexical choices? | Why did you preserve ICMS and add an explanation? | What is the difference between “tax rate” and “tax base”? | How would you justify translating “juiz relator” as “reporting judge”?","Explicações do minissimulado: Explain why “tax replacement” is not an ideal translation of substituição tributária. | Explain the difference between an acórdão and a sentença. | Explain your choice for Ministério Público Federal. | Explain why intrastate is more specific than domestic in an ICMS text. | Explain the difference between waiver, resignation and relinquishment.","“Incorporação de ações” (art. 252 da Lei das S.A.) não é necessariamente uma merger anglo-americana. “Share incorporation” com explicação do instituto brasileiro é uma opção conservadora; “share-for-share exchange” pode ser funcional em alguns contextos, mas não reproduz automaticamente todos os efeitos jurídicos. “Incorporação da Holding” é uma operação distinta e pode exigir “merger by absorption”. “Data de Implemento das Condições Suspensivas” é uma data definida no instrumento, por isso sua tradução deve ser consistente em todas as ocorrências.","Os equivalentes variam conforme jurisdição, gênero textual e finalidade. Nomes de órgãos são versões funcionais para estudo; não substituem a denominação oficial usada em um documento específico. O glossário é material de preparação, não previsão de questões nem tradução oficial certificada.","O texto do adendo (cláusula 6 de um Protocolo e Justificação de Incorporação) só vem traduzido para o inglês na apostila, sem o original em português. Por isso ele aparece aqui pelo glossário e pelas justificativas."]},{"id":"assembleia","title":"Assembleia de Trabalhadores","source":"Assembleia de Trabalhadores – Workers Assembly.docx","sections":["Glossário trabalhista e sindical"],"glossary":[["Deflagração de greve","Calling a strike / Instigation of a strike","Launching a strike","The union announced the calling of a nationwide strike starting Monday.","O sindicato anunciou a deflagração de uma greve nacional a partir de segunda-feira.","O material traz “instigation”, que tem tom de incitação. “Calling / launching a strike” é o uso corrente.",0,""],["Assembleia geral","General assembly","General meeting, Membership meeting","All registered union members must attend the upcoming general assembly.","Todos os filiados registrados do sindicato devem comparecer à próxima assembleia geral.","",0,""],["Liberdade sindical","Trade union freedom / Freedom of association","Union liberty","International conventions protect the right to trade union freedom.","Convenções internacionais protegem o direito à liberdade sindical.","“Freedom of association” é o termo das Convenções 87 e 98 da OIT.",0,""],["Legislação laboral","Labor legislation","Employment law, Industrial relations law","Recent reforms introduced major changes to national labor legislation.","Reformas recentes introduziram mudanças profundas na legislação laboral nacional.","",0,""],["Estatuto social (de sindicato)","Union bylaws / Articles of association","Constituent document","The convocation procedure must follow the strict rules of the union bylaws.","O procedimento de convocação deve seguir as regras estritas do estatuto social do sindicato.","",0,""],["Prazo de antecedência","Advance notice period","Notification period, Prior notice timeline","The statute requires a seventy-two-hour advance notice period before a strike.","O estatuto exige um prazo de antecedência de setenta e duas horas antes de uma greve.","Na Lei 7.783/89, 72 h é o aviso para serviços essenciais; nos demais, 48 h.",0,""],["Categoria profissional","Professional category / Bargaining unit","Occupational group","The collective bargaining agreement applies to the entire professional category.","O acordo coletivo de trabalho aplica-se a toda a categoria profissional.","",0,""],["Proposta patronal","Employer proposal / Management proposal","Employers' offer","Workers overwhelmingly rejected the employer proposal during the vote.","Os trabalhadores rejeitaram esmagadoramente a proposta patronal durante a votação.","",0,""],["Acordo coletivo","Collective agreement","Collective bargaining agreement","The union and management signed a two-year collective agreement.","O sindicato e a gestão assinaram um acordo coletivo de dois anos.","No Brasil há acordo coletivo (sindicato × empresa) e convenção coletiva (sindicato × sindicato patronal). Se o texto distinguir, marque: “collective agreement (acordo coletivo)”.",0,""],["Fundo de greve","Strike fund","Industrial action fund, Mutual assistance fund","The union utilized its strike fund to support workers during the stoppage.","O sindicato utilizou seu fundo de greve para apoiar os trabalhadores durante a paralisação.","",0,""],["Negociação paritária","Parity negotiation","Bilateral negotiation, Joint negotiation","Parity negotiation committees facilitate open dialogue between labor and management.","Comissões de negociação paritária facilitam o diálogo aberto entre empregados e empregadores.","",0,""],["Quórum de deliberação","Deliberation quorum","Voting quorum","The assembly lacked the required deliberation quorum to pass the resolution.","A assembleia não atingiu o quórum de deliberação exigido para aprovar a resolução.","",0,""],["Votação secreta","Secret ballot","Secret vote","The union statute mandates a secret ballot for leadership elections.","O estatuto sindical obriga a votação secreta para as eleições de diretoria.","",0,""],["Vício de representatividade","Flaw in representation / Representative defect","Representation deficit","The court annulled the resolution due to a severe flaw in representation.","O tribunal anulou a resolução devido a um grave vício de representatividade.","",0,""],["Abuso de direito","Abuse of rights","Abuse of process, Abuse of legal right","Exercising a strike arbitrarily may constitute an abuse of rights.","O exercício da greve de forma arbitrária pode configurar abuso de direito.","",0,""],["Ministério Público do Trabalho (MPT)","Labor Public Prosecution Service / Labor Prosecution Office","Office of the Labor Prosecutor","The Labor Public Prosecution Service intervened to mediate the labor dispute.","O Ministério Público do Trabalho interveio para mediar o litígio laboral.","Em tradução pública, na primeira ocorrência dá para manter o original entre parênteses: “Labor Prosecution Office (Ministério Público do Trabalho – MPT)”.",0,""],["Pleito (assembleia/eleição)","Dispute / Electoral contest / Proceeding","Ballot, Vote","The union leadership announced the official results of the electoral contest.","A diretoria sindical anunciou os resultados oficiais do pleito.","“Pleito” muda conforme o contexto: eleição → election/contest; demanda → claim/dispute.",0,""],["Poder de barganha","Bargaining power","Negotiating leverage","Unionization significantly increases workers' collective bargaining power.","A sindicalização aumenta significativamente o poder de barganha coletiva dos trabalhadores.","",0,""],["Boa-fé objetiva","Objective good faith","Fair dealing, Good faith principle","Contractual negotiations must be conducted under strict objective good faith.","Negociações contratuais devem ser conduzidas sob estrita boa-fé objetiva.","",0,""],["Ditames constitucionais","Constitutional tenets / Constitutional mandates","Constitutional dictates","All labor regulations must fully comply with constitutional tenets.","Todas as normas laborais devem cumprir integralmente os ditames constitucionais.","",0,""],["Empregado / Trabalhador","Employee / Worker","Staff member","The company hired fifty new employees for the manufacturing plant.","A empresa contratou cinquenta novos empregados para a planta fabril.","Employer = empregador. Employee = empregado. Não troque.",0,""],["Sindicato","Trade union / Labor union","Union","The trade union filed a formal grievance regarding unpaid overtime hours.","O sindicato protocolou uma reclamação formal referente a horas extras não pagas.","Falso cognato: “syndicate” é consórcio (ou organização criminosa), nunca sindicato.",0,""],["Pretensão","Claim / Demand","Assertion","The union's financial claim was partially accepted by the labor court.","A pretensão financeira do sindicato foi parcialmente aceita pela justiça do trabalho.","Falso cognato: “to pretend” = fingir.",0,""],["Rescisão (contratual)","Termination","Severance, Rescission","The collective agreement establishes guidelines for employment contract termination.","O acordo coletivo estabelece diretrizes para a rescisão do contrato de trabalho.","",0,""],["Verbas rescisórias","Severance pay / Termination benefits","Exit package","Unpaid severance pay prompted workers to stage a protest at the factory gate.","Verbas rescisórias não pagas motivaram os trabalhadores a realizar um protesto no portão da fábrica.","",0,""],["Homologação (rescisão/acordo)","Ratification / Judicial or union approval","Validation","Historically, union ratification was mandatory for employment terminations.","Historicamente, a homologação sindical era obrigatória para as rescisões de contrato.","",0,""],["Estabilidade provisória","Provisional job stability / Job tenure protection","Protected employment status","Pregnant employees enjoy provisional job stability under statutory law.","Empregadas gestantes gozam de estabilidade provisória por lei estatutária.","",0,""],["Cota (deficientes/aprendizes)","Statutory quota","Mandatory quota system","Companies must comply with statutory quotas for hiring disabled workers.","As empresas devem cumprir cotas estatutárias para contratação de trabalhadores com deficiência.","",0,""],["Jornada de trabalho","Working hours / Work shift","Hours of work","Maximum weekly working hours are strictly capped by labor regulations.","A jornada máxima de trabalho semanal é rigorosamente limitada pelas normas trabalhistas.","",0,""],["Horas extraordinárias","Overtime hours","Extra hours","Employees working beyond shift limits are entitled to overtime pay.","Empregados que trabalham além dos limites do turno têm direito ao pagamento de horas extras.","",0,""],["Adicional noturno","Night shift differential","Night work premium","Laborers working between 10 PM and 5 AM receive a night shift differential.","Trabalhadores que atuam entre 22h e 5h recebem adicional noturno.","",0,""],["Insalubridade","Unhealthy working conditions / Unhealthiness","Hazardous working conditions","Workers exposed to chemical hazards are paid an unhealthy working conditions allowance.","Trabalhadores expostos a riscos químicos recebem um adicional de insalubridade.","O material diz “unhealthiness bonus”, que é bem literal. “Unhealthy working conditions allowance” soa mais natural.",0,""],["Periculosidade","Hazard pay / Hazardousness","Dangerous working conditions","Electricians operating in high-voltage grids qualify for hazard pay.","Eletricistas que operam em redes de alta tensão qualificam-se para o adicional de periculosidade.","Não confunda: periculosidade = risco de morte/acidente (hazard pay); insalubridade = dano à saúde.",0,""],["Acidente de trabalho","Workplace accident / Industrial accident","Occupational injury","The employer is strictly liable for failing to prevent a severe workplace accident.","O empregador responde objetivamente por não ter evitado um grave acidente de trabalho.","Responder objetivamente = to be strictly liable.",0,""],["Doença ocupacional","Occupational disease","Work-related illness","Repetitive strain injury is recognized as a common occupational disease.","A lesão por esforço repetitivo é reconhecida como uma doença ocupacional comum.","",0,""],["Assédio moral","Workplace bullying / Moral harassment","Psychological harassment","Employers must maintain an environment free from workplace bullying.","Os empregadores devem manter um ambiente livre de assédio moral.","",0,""],["Assédio sexual","Sexual harassment","Workplace sexual harassment","Zero tolerance policies apply to any form of sexual harassment.","Políticas de tolerância zero aplicam-se a qualquer forma de assédio sexual.","",0,""],["Terceirização","Outsourcing / Subcontracting","Third-party contracting","Outsourcing of core activities is strictly regulated by recent statutes.","A terceirização de atividades-fim é rigorosamente regulada por estatutos recentes.","Atividade-fim = core activity; atividade-meio = non-core / support activity.",0,""],["Trabalhador autônomo","Independent contractor / Self-employed worker","Freelance worker","Independent contractors do not enjoy standard employment benefit protections.","Trabalhadores autônomos não desfrutam de proteções de benefícios trabalhistas padrão.","",0,""],["Vínculo empregatício","Employment relationship / Employment bond","Employment link","The plaintiff filed a lawsuit to recognize an underlying employment relationship.","O autor ajuizou ação para reconhecer o vínculo empregatício subjacente.","O material lista “master-servant relationship” como sinônimo, mas é termo arcaico da common law. Evite em texto moderno.",0,""],["Carteira de trabalho","Work card / Employment record book","Labor booklet","Formal registration requires entering the contract into the employee's work card.","O registro formal exige a anotação do contrato na carteira de trabalho do empregado.","Em documento oficial: “Work and Social Security Card (CTPS)”.",0,""],["Férias remuneradas","Paid annual leave","Paid vacation","Every worker is entitled to thirty days of paid annual leave per year.","Todo trabalhador tem direito a trinta dias de férias remuneradas por ano.","",0,""],["Décimo terceiro salário","Thirteenth-month salary","Christmas bonus, Year-end bonus","The law mandates the payment of a thirteenth-month salary in December.","A lei obriga o pagamento do décimo terceiro salário em dezembro.","“Christmas bonus” é informal e sugere algo opcional. Em texto jurídico, use “thirteenth-month salary”.",0,""],["FGTS","Severance Indemnity Fund for Employees","Mandatory severance savings fund","Employers must monthly deposit eight percent of wages into the employee's FGTS.","Os empregadores devem depositar mensalmente oito por cento dos salários no FGTS do empregado.","Na tradução pública, mantenha a sigla: “FGTS (Severance Indemnity Fund)”.",0,""],["Seguro-desemprego","Unemployment insurance / Unemployment benefits","Jobseeker's allowance","Laid-off workers meeting criteria can apply for state unemployment insurance.","Trabalhadores demitidos que cumprem os critérios podem solicitar o seguro-desemprego estatal.","",0,""],["Greve abusiva","Unlawful strike / Abusive strike","Illegal strike action","The labor court declared the ongoing transport strike unlawful.","A justiça do trabalho declarou abusiva a greve de transportes em andamento.","",0,""],["Piquete","Picket line","Picketing group","Strikers formed a peaceful picket line outside the corporate headquarters.","Os grevistas formaram um piquete pacífico fora da sede corporativa.","",0,""],["Lockout (paralisação patronal)","Employer lockout","Management lockout","Employer lockouts are prohibited under Brazilian strike law.","O lockout patronal é proibido pela lei de greve brasileira.","Correção do material: a proibição do lockout está no art. 17 da Lei 7.783/89 (Lei de Greve), não na Constituição.",0,""],["Comissão de conciliação prévia","Prior conciliation commission","Pre-litigation settlement board","Disputed claims can be submitted to a prior conciliation commission.","Reivindicações controvertidas podem ser submetidas a uma comissão de conciliação prévia.","",0,""],["Arbitragem trabalhista","Labor arbitration","Industrial arbitration","Collective labor disputes can be resolved via binding labor arbitration.","Conflitos coletivos de trabalho podem ser resolvidos por via de arbitragem trabalhista vinculante.","",0,""],["Reclamação trabalhista","Labor claim / Labor lawsuit","Employment suit","The former worker filed a labor claim demanding unpaid overtime.","O ex-trabalhador ajuizou reclamação trabalhista exigindo horas extras não pagas.","",0,""],["Ônus da prova","Burden of proof","Evidentiary burden","Employers bear the burden of proof regarding recorded working hours.","Os empregadores arcam com o ônus da prova referente aos horários de trabalho registrados.","",0,""],["Prescrição quinquenal / bienal","Five-year / two-year limitation period","Statute of limitations","Labor claims are subject to a five-year limitation period during employment and two years post-termination.","Reclamações trabalhistas estão sujeitas ao prazo prescricional quinquenal durante o contrato e bienal pós-rescisão.","",0,""],["Solidariedade trabalhista","Joint and several liability","Joint labor liability","Corporate groups face joint and several liability for unpaid labor debts.","Grupos econômicos enfrentam solidariedade trabalhista por débitos laborais não quitados.","",0,""],["Sucessão trabalhista","Labor succession / Transfer of business enterprise","Successor employer liability","The acquiring company assumed full liability through labor succession.","A empresa sucessora assumiu total responsabilidade por meio da sucessão trabalhista.","",0,""],["Negociação coletiva","Collective bargaining","Collective negotiation","Robust collective bargaining prevents unnecessary industrial conflicts.","A negociação coletiva robusta evita conflitos industriais desnecessários.","",0,""],["Norma mais favorável","Most favorable standard principle","Principle of the most favorable rule","Conflicts between norms are resolved applying the most favorable standard principle.","Conflitos entre normas resolvem-se aplicando o princípio da norma mais favorável.","",0,""],["Irrenunciabilidade de direitos","Inalienability of labor rights / Non-waivability of rights","Waiver restriction","Labor rights possess statutory inalienability to protect vulnerable workers.","Os direitos trabalhistas possuem irrenunciabilidade legal para proteger trabalhadores vulneráveis.","",0,""],["Indenização por danos morais","Compensation for non-pecuniary damage / Moral damages award","Pain and suffering damages","The court ordered compensation for non-pecuniary damage due to workplace harassment.","O tribunal determinou indenização por danos morais devido a assédio no ambiente de trabalho.","“Moral damages” é decalque e pode confundir leitor anglófono. “Non-pecuniary damage” é o termo seguro.",0,""],["Salário-mínimo","Minimum wage","Statutory floor wage","The national minimum wage must cover basic living expenses under the law.","O salário-mínimo nacional deve cobrir despesas básicas de subsistência por força de lei.","",0,""]],"paragraphs":[{"pt":"A deflagração de greves e a deliberação em assembleia geral de trabalhadores constituem pilares fundamentais da liberdade sindical e da democracia participativa nas relações de trabalho.","en":"The instigation of strikes and deliberation in a general assembly of workers constitute fundamental pillars of trade union freedom and participatory democracy in labor relations.","note":"“Instigation” também sugere incitação. Numa versão natural, “The calling of strikes” funciona melhor e evita ruído para o examinador.","terms":[1,2,3]},{"pt":"Conforme preconiza a legislação laboral e a jurisprudência pátria, a convocação da assembleia deve observar estritamente o estatuto social da entidade sindical e os prazos de antecedência legal, garantindo ampla publicidade a toda a categoria profissional.","en":"As advocated by labor legislation and domestic jurisprudence, the convening of the assembly must strictly observe the union’s bylaws and statutory advance notice periods, ensuring broad publicity to the entire professional category.","note":"“Jurisprudência pátria” = domestic case law. Em inglês, “jurisprudence” costuma significar teoria do direito; “case law” é mais preciso.","terms":[4,5,6,7]},{"pt":"Durante o conclave, os obreiros discutem pautas cruciais, tais como a rejeição ou acolhimento de proposta patronal de acordo coletivo, a instituição de fundo de greve e a eleição de comissões de negociação paritária.","en":"During the meeting, workers discuss crucial agendas, such as the rejection or acceptance of an employer collective agreement proposal, the establishment of a strike fund, and the election of parity negotiation committees.","terms":[8,9,10,11]},{"pt":"Cumpre ressaltar que o quórum de deliberação e a exigência de votação secreta revestem-se de imperativa formalidade para conferir validade jurídica às decisões tomadas, coibindo vícios de representatividade e abusos de direito.","en":"It is worth noting that the deliberation quorum and the requirement of secret ballot are invested with mandatory formality to confer legal validity upon the decisions made, curbing flaws in representation and abuses of rights.","terms":[12,13,14,15]},{"pt":"Por conseguinte, a patronal e o Ministério Público do Trabalho acompanham com cautela os desdobramentos desses pleitos, visando assegurar a continuidade dos serviços essenciais e o respeito irrestrito ao direito de greve, sem prejuízo da ordem pública e da paz social.","en":"Consequently, the employers’ side and the Labor Public Prosecution Service closely monitor the developments of these disputes, aiming to ensure the continuity of essential services and unrestricted respect for the right to strike, without prejudice to public order and social peace.","terms":[16,17]},{"pt":"Assim, o equilíbrio entre o poder de barganha coletiva dos empregados e a estabilidade econômica das empresas pressupõe um diálogo institucional transparente, pautado pela boa-fé objetiva e pelo respeito mútuo aos ditames constitucionais.","en":"Thus, the balance between employees’ collective bargaining power and companies’ economic stability presupposes transparent institutional dialogue, guided by objective good faith and mutual respect f "",3,""],["impor sanções financeiras a um governo estrangeiro","To impose financial sanctions on a foreign government","","","","",3,""],["bloquear o acesso a recursos","To block access to funds","","","","",3,""],["restringir transações financeiras","To restrict financial transactions","","","","",3,""],["designar uma pessoa no âmbito de um regime de sanções","To designate an individual under a sanctions regime","","","","",3,""],["suspender ou retirar sanções","To lift sanctions","","","","",3,""],["contornar sanções","To circumvent sanctions","","","","",3,""],["fazer cumprir ou aplicar sanções","To enforce sanctions","","","","",3,""],["cumprir os regulamentos de sanções","To comply with sanctions regulations","","","","",3,""],["apreender bens em cumprimento de uma ordem judicial","To seize assets pursuant to a court order","","","","",3,""],["Tarifa de importação","Import tariff","","","","",4,"Tributo incidente sobre importações."],["Tarifas alfandegárias","Customs duties / tariffs","","The country imposed retaliatory tariffs.","O país impôs tarifas retaliatórias.","",4,"Customs duties é uma opção formal."],["Aumento expressivo de tarifas","Sharp tariff increases / steep tariff hikes","","","","",4,"Boa tradução para “tarifaço”."],["Elevação de tarifas","Tariff hikes / tariff increases","","The government announced steep tariff increases on imported goods.","O governo anunciou um tarifaço sobre produtos importados.","",4,"Aumento de tarifas."],["Tarifas elevadas","High tariffs / steep tariffs","","","","",4,"Nível elevado das tarifas."],["Tarifas punitivas","Punitive tariffs","","","","",4,"Tarifas destinadas a exercer pressão ou penalizar."],["Tarifas retaliatórias","Retaliatory tariffs","","The country imposed retaliatory tariffs.","O país impôs tarifas retaliatórias.","",4,"Tarifas adotadas em resposta a medidas de outro país."],["Tarifas recíprocas","Reciprocal tariffs","","","","",4,"Tarifas descritas como resposta a tarifas ou barreiras impostas por out srupt global supply chains.","As tarifas podem prejudicar as cadeias globais de suprimentos.","",4,"Redes internacionais de produção e fornecimento."],["Custos de importação","Import costs","","","","",4,"Custos associados à importação."],["Preços ao consumidor","Consumer prices","","The new tariffs could drive up consumer prices.","As novas tarifas podem elevar os preços ao consumidor.","",4,"Preços pagos pelos consumidores."],["Inflação","Inflation","","","","",4,"Aumento generalizado dos preços."],["Acordo comercial","Trade agreement","","","","",4,"Acordo entre países ou blocos."],["Negociações comerciais","Trade negotiations","","","","",4,"Negociações relacionadas ao comércio."],["Determinar","To order / to determine","","To order the freezing of assets","","",5,""],["Autorizar","To authorize","","To authorize access to records","","",5,""],["Afastar","To lift / to waive","","To lift bank secrecy","","",5,""],["Interceptar","To intercept","","To intercept communications","","",5,""],["Divulgar","To disclose","","To disclose confidential information","","",5,""],["Revelar","To reveal","","To reveal financial information","","",5,""],["Obter","To obtain","","To obtain bank records","","",5,""],["Congelar","To freeze","","To freeze assets","","",5,""],["Bloquear","To block","","To block transactions","","",5,""],["Apreender","To seize","","To seize property","","",5,""],["Confiscar","To confiscate / to forfeit","","To confiscate assets","","",5,""],["Restringir","To restrict","","To restrict trade","","",5,""],["Impor","To impose","","To impose sanctions","","",5,""],["Aplicar","To impose / to enforce","","To impose penalties","","",5,""],["Suspender","To suspend","","To suspend sanctions","","",5,""],["Revogar","To revoke / to repeal","","To revoke an authorization / repeal a law","","",5,""],["Contornar","To circumvent","","To circumvent sanctions","","",5,""],["Cumprir","To comply with","","To comply with a court order","","",5,""],["Violar","To violate / to breach","","To violate confidentiality rules","","",5,""],["Investigar","To investigate","","To investigate suspicious transactions","","",5,""],["Rastrear","To trace","","To trace illicit funds","","",5,""],["Proibir","To prohibit / to ban","","To prohibit certain transactions","","",5,""],["Retaliar","To retaliate","","To retaliate against trade restrictions","","",5,""],["Elevar","To raise / to increase","","To raise tariffs","","",5,""],["Prejudicar","To harm / to undermine","","To undermine economic growth","","",5,""],["Apreensão","Seizure","","","","Não equivale automaticamente a congelamento.",6,""],["Perda ou confisco de bens, conforme o contexto jurídico","Forfeiture","","","","Não é sinônimo genérico de bloqueio.",6,""],["Divulgação ou revelação","Disclosure","","","","Não significa necessariamente quebra de sigilo por ordem judicial.",6,""],["Prova / evidência","Evidence","","","","Em processo jurídico, geralmente prefira “prova” em português.",6,""],["Por fim / finalmente","Eventually","","","","Não significa “eventualmente”.",6,""],["Real / efetivo","Actual","","","","Não significa “atual”.",6,""],["Imposto por fim","Eventually imposed","","","","Não “imposto eventualmente”, se o sentido for temporal.",6,""],["Política / diretriz","Policy","","","","Não significa necessariamente “polícia”.",6,""],["Sanções abrangentes","Comprehensive sanctions","","","","Não significa “sanções compreensivas”.",6,""],["Ativos / bens / patrimônio","Assets","","","","A tradução depende do tipo de ativo e do contexto.",6,""],["Dever ou tarifa/tributo aduaneiro","Duty","","","","Em customs duty, significa direito aduaneiro ou imposto de importação, conforme o contexto.",6,""],["Alegação, reivindicação ou pedido","Claim","","","","Não significa automaticamente “reclamação”.",6,""],["Ordem / determinação / decisão","Order","","","","Em contexto judicial, pode ser “ordem judicial”.",6,""]],"paragraphs":[{"pt":"O governo anunciou um tarifaço sobre produtos importados.","en":"The government announced steep tariff increases on imported goods.","label":"Frase de alto rendimento"},{"pt":"As novas tarifas podem elevar os preços ao consumidor.","en":"The new tariffs could drive up consumer prices.","label":"Frase de alto rendimento"},{"pt":"O país impôs tarifas retaliatórias.","en":"The country imposed retaliatory tariffs.","label":"Frase de alto rendimento"},{"pt":"A medida intensificou a guerra comercial.","en":"The measure escalated the trade war.","label":"Frase de alto rendimento"},{"pt":"As empresas enfrentam custos mais elevados.","en":"Businesses are facing higher costs.","label":"Frase de alto rendimento"},{"pt":"Os países recorreram a medidas protecionistas.","en":"The countries resorted to protectionist measures.","label":"Frase de alto rendimento"},{"pt":"As tarifas podem prejudicar as cadeias globais de suprimentos.","en":"Tariffs could disrupt global supply chains.","label":"Frase de alto rendimento"},{"pt":"A decisão provocou tensões diplomáticas.","en":"The decision triggered diplomatic tensions.","label":"Frase de alto rendimento"},{"pt":"O governo pretende proteger a indústria nacional.","en":"The government aims to protect domestic industry.","label":"Frase de alto rendimento"},{"pt":"As medidas podem desencadear uma retaliação comercial.","en":"The measures could trigger trade retaliation.","label":"Frase de alto rendimento"},{"pt":"Por que você escolheu “asset freeze” em vez de “confiscation”? (Responda em inglês.)","en":"I chose asset freeze because it refers to restricting access to or dealings with assets, whereas confiscation generally involves the permanent loss of property under the applicable legal framework. The terms are not interchangeable.","note":"Pergunta em inglês: Why did you choose “asset freeze” rather than “confiscation”?","label":"Arguição"},{"pt":"Como você traduziria “quebra de sigilo bancário”? (Responda em inglês.)","en":"I would generally use lifting of bank secrecy. However, if the context specifically refers to the disclosure of bank records, I would consider disclosure of banking information to convey the precise legal meaning.","note":"Pergunta em inglês: How would you translate “quebra de sigilo bancário”?","label":"Arguição"},{"pt":"Como traduzir “tarifaço” em um discurso formal? (Responda em inglês.)","en":"I would avoid a literal translation and use steep tariff increases or sharp tariff hikes. These expressions convey the idea of a substantial increase in import tariffs in natural, formal English.","note":"Pergunta em inglês: How would you translate “tarifaço” in a formal speech?","label":"Arguição"},{"pt":"Qual é a diferença entre “telephone records” e “telephone interception”? (Responda em inglês.)","en":"Telephone records refer to information about calls, such as their dates, times and numbers. Telephone interception, by contrast, involves capturing communications themselves. The distinction is important for terminological accuracy.","note":"Pergunta em inglês: What is the difference between “telephone records” and “telephone interception”?","label":"Arguição"}],"notes":["Uma distinção essencial para a prova: telephone tapping, disclosure of bank records e asset freeze não são expressões intercambiáveis. O contexto jurídico determina a tradução adequada.","Telephone records: registros das ligações.","Telephone interception: interceptação do conteúdo das comunicações.","Disclosure of telephone records: fornecimento ou divulgação dos registros telefônicos.","Lifting of telephone secrecy: expressão descritiva para o afastamento do sigilo, que pode exigir adaptação conforme o contexto.","A legislação brasileira sobre interceptações telefônicas é uma referência útil para reconhecer essa distinção terminológica.","Atenção à diferença jurídica: freezing/blocking não significa necessariamente confiscation. No regime administrado pelo OFAC, por exemplo, o bloqueio restringe as operações com o bem, mas não transfere automaticamente sua propriedade ao governo.","A palavra tarifaço é coloquial em português. Em uma tradução formal, prefira steep tariff increases, sharp tariff hikes ou sweeping tariff increases, conforme o contexto.","Estratégia de memorização: priorize primeiro os pares freeze/block, seize/confiscate, records/interception, sanctions/tariffs e disclosure/confidentiality. Depois, treine as combinações verbais e as quatro respostas de arguição em voz alta. Essa sequência ajuda a recuperar a terminologia com rapidez durante a prova oral TIPS."]},{"id":"terras-raras","title":"Minerais Críticos (notícia)","source":"Terras Raras.pdf (Agência Brasil, out/2026)","sections":["Mineração e mercado de trabalho","Minerais","Verbos e conectores de notícia"],"glossary":[["minerais críticos e estratégicos","critical and strategic minerals","","The data are available on the Critical and Strategic Minerals Portal, launched last week by the National Mining Agency (ANM).","Os dados estão disponíveis no Portal de Minerais Críticos e Estratégicos, lançado na última semana pela Agência Nacional de Mineração (ANM).","",0,""],["indústria extrativa mineral","mineral extractive industry","mining industry","Activities related to the critical and strategic minerals (CSM) sector in Brazil accounted for 129,423 jobs in 2025, equivalent to 57% of the 226,634 jobs in the country's mineral extractive industry.","As atividades relacionadas ao setor de minerais críticos e estratégicos (MCE) para o Brasil somaram 129.423 empregos, em 2025, o equivalente a 57% dos 226.634 empregos da indústria extrativa mineral do país.","",0,""],["postos de trabalho","jobs","job positions, positions","Women hold the remaining 22%, or 28,658 jobs.","As mulheres ocupam os 22% restantes, 28.658 postos.","",0,""],["mercado de trabalho","labor market","","Compared with the same labor market recorded in 2023, there was an 8.6% increase over the period.","Quando comparado ao mesmo mercado de trabalho registrado em 2023, houve crescimento de 8,6% no período.","",0,""], dos trabalhadores de níveis de escolaridade fundamental, médio e superior foram respectivamente de R$ 3.218; R$ 4.142 e R$ 11.856.","",2,""],["restantes","remaining","","Women hold the remaining 22%, or 28,658 jobs.","As mulheres ocupam os 22% restantes, 28.658 postos.","",2,""],["seguido por","followed by","","When jobs are broken down by type of mineral, iron mining employs the most people (70,027 jobs), followed by precious metals, with a total of 21,313 jobs.","Quando considerados os empregos gerados por tipo de mineral, o extrativismo que mais emprega é do ferro (70.027 postos de trabalho). Seguido por metais preciosos que somam 21.313 empregos.","",2,""],["de acordo com","according to","","According to the indicators, in 2025 the country had 1,012 producing areas, which generated R$250.4 billion.","De acordo com os indicadores, em 2025 o país tinha 1.012 áreas em produção que resultaram em R$ 250,4 bilhões ao país.","",2,""],["lançar (um portal)","to launch","","","","",2,""]],"paragraphs":[{"pt":"As atividades relacionadas ao setor de minerais críticos e estratégicos (MCE) para o Brasil somaram 129.423 empregos, em 2025, o equivalente a 57% dos 226.634 empregos da indústria extrativa mineral do país.","en":"Activities related to the critical and strategic minerals (CSM) sector in Brazil accounted for 129,423 jobs in 2025, equivalent to 57% of the 226,634 jobs in the country's mineral extractive industry.","note":"Modelo de versão feito por Claude. Números: 129.423 → 129,423. Em inglês, ponto e vírgula se invertem."},{"pt":"Quando comparado ao mesmo mercado de trabalho registrado em 2023, houve crescimento de 8,6% no período. Os dados estão disponíveis no Portal de Minerais Críticos e Estratégicos, lançado na última semana pela Agência Nacional de Mineração (ANM).","en":"Compared with the same labor market recorded in 2023, there was an 8.6% increase over the period. The data are available on the Critical and Strategic Minerals Portal, launched last week by the National Mining Agency (ANM).","note":"Modelo de versão feito por Claude. 8,6% → 8.6%. \"Na última semana\" = last week."},{"pt":"As unidades da federação que mais empregam são Minas Gerais (62.631 postos de trabalho); Pará (27.047); e Bahia (9.147).","en":"The states that employ the most are Minas Gerais (62,631 jobs), Pará (27,047) and Bahia (9,147).","note":"Modelo de versão feito por Claude. \"Unidades da federação\" = states (ou federative units, mais formal)."},{"pt":"Além dos dados sobre empregos, o painel permite consultar informações sobre o perfil dos trabalhadores, remuneração média e as 21 substâncias relacionadas a essas atividades, entre elas, alumínio, ouro, ferro, cobre, terras-raras, nióbio, titânio e lítio.","en":"In addition to employment data, the dashboard provides information on the workforce profile, average pay and the 21 substances related to these activities, including aluminum, gold, iron, copper, rare earths, niobium, titanium and lithium.","note":"Modelo de versão feito por Claude."},{"pt":"A análise do mercado formal de trabalho da indústria extrativa mineral da plataforma foi realizada a partir dos microdados da Relação Anual de Informações Sociais (Rais) e do Novo Cadastro Geral de Empregados e Desempregados (Novo Caged), disponibilizados pelo Ministério do Trabalho e Emprego (MTE).","en":"The platform's analysis of the formal labor market in the mineral extractive industry was based on microdata from the Annual Social Information Report (RAIS) and the New General Register of Employed and Unemployed Persons (Novo Caged), made available by the Ministry of Labor and Employment (MTE).","note":"Modelo de versão feito por Claude. Siglas brasileiras: mantenha a sigla e dê a tradução descritiva na primeira menção."},{"pt":"De acordo com os dados do portal, a participação masculina (100.765 empregos) equivale a 78% do total de empregos relacionados a minerais críticos e estratégicos (129.423). As mulheres ocupam os 22% restantes, 28.658 postos.","en":"According to the portal's data, men (100,765 jobs) account for 78% of all jobs related to critical and strategic minerals (129,423). Women hold the remaining 22%, or 28,658 jobs.","note":"Modelo de versão feito por Claude."},{"pt":"No gráfico de empregos, relacionados aos MCE, 51.714 são de mão de obra qualificada, o equivalente a 23% de todos os empregos.","en":"In the chart of CSM-related jobs, 51,714 are held by skilled workers, equivalent to 23% of all jobs.","note":"Modelo de versão feito por Claude."},{"pt":"Os trabalhadores com ensino superior somam 30.707, que representa 14%. Destes mais de 30 mil postos de trabalho, 19.060 são ocupados por homens e 11.647, por mulheres.","en":"Workers with higher education total 30,707, or 14%. Of these more than 30,000 jobs, 19,060 are held by men and 11,647 by women.","note":"Modelo de versão feito por Claude."},{"pt":"Quando considerados os empregos gerados por tipo de mineral, o extrativismo que mais emprega é do ferro (70.027 postos de trabalho). Seguido por metais preciosos que somam 21.313 empregos.","en":"When jobs are broken down by type of mineral, iron mining employs the most people (70,027 jobs), followed by precious metals, with a total of 21,313 jobs.","note":"Modelo de versão feito por Claude."},{"pt":"Em 2025, as remunerações médias dos trabalhadores de níveis de escolaridade fundamental, médio e superior foram respectivamente de R$ 3.218; R$ 4.142 e R$ 11.856.","en":"In 2025, the average pay of workers with primary, secondary and higher education was R$3,218, R$4,142 and R$11,856, respectively.","note":"Modelo de versão feito por Claude. Fundamental/médio/superior → primary/secondary/higher education. \"Respectivamente\" vai para o fim: respectively."},{"pt":"O portal também mostra a distribuição territorial dos municípios produtores com um mapa geoespacial. Entre os municípios com maior número de trabalhadores em atividades relacionadas aos MCE estão Parauapebas (PA), com 8.234 empregos; Nova Lima (MG), com 8.218; e Congonhas (MG), com 7.114.","en":"The portal also shows the territorial distribution of producing municipalities on a geospatial map. The municipalities with the largest number of workers in CSM-related activities include Parauapebas (PA), with 8,234 jobs; Nova Lima (MG), with 8,218; and Congonhas (MG), with 7,114.","note":"Modelo de versão feito por Claude."},{"pt":"Em Parauapebas, são 8.234 trabalhadores (71,4% do gênero masculino e 28,6% do gênero feminino), sendo 1.851 com nível superior.","en":"Parauapebas has 8,234 workers (71.4% male and 28.6% female), 1,851 of whom have a university degree.","note":"Modelo de versão feito por Claude."},{"pt":"Em Nova Lima, dos 8.218 empregados (63,3% do gênero masculino e 36,7% do gênero feminino), 4.776 tem nível superior. Em Congonhas, são 7.114 trabalhadores (73,2% do gênero masculino e 26,8% gênero feminino), sendo 1.234 trabalhadores com nível superior.","en":"In Nova Lima, of the 8,218 employees (63.3% male and 36.7% female), 4,776 have a university degree. Congonhas has 7,114 workers (73.2% male and 26.8% female), 1,234 of whom have a university degree.","note":"Modelo de versão feito por Claude."},{"pt":"Para contribuir com a transparência e a divulgação de informações sobre o desempenho da mineração no país, o site apresenta informações de exploração, valor investido e produção e comércio exterior. De acordo com os indicadores, em 2025 o país tinha 1.012 áreas em produção que resultaram em R$ 250,4 bilhões ao país.","en":"To promote transparency and the dissemination of information on the performance of mining in the country, the website provides data on exploration, investment, production and foreign trade. According to the indicators, in 2025 the country had 1,012 producing areas, which generated R$250.4 billion.","note":"Modelo de versão feito por Claude. R$ 250,4 bilhões → R$250.4 billion (sem espaço depois de R$ em inglês; billion = bilhão)."}],"notes":["O material é só a notícia em portu let S=store.get("tips-study-v1",{});

const ALL=()=>M().glossary.map((g,i)=>({i,pt:g[0],en:g[1],syn:g[2]||"",exEn:g[3]||"",exPt:g[4]||"",note:g[5]||"",sec:g[6]||0,info:g[7]||""}));
const G=()=>{const s=D().sec;return ALL().filter(t=>s<0||t.sec===s)};
const head=s=>s.split(/ \/ |; /)[0].trim();
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g,"'").replace(/\(.*?\)/g," ").replace(/[^a-z0-9' -]/g," ").replace(/\s+/g," ").trim();
const core=s=>norm(s).replace(/^(to|the|a|an|o|a|os|as) /,"").trim();

function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function judge(answer,accepted){const a=core(answer);if(!a)return 0;let best=0;for(const x of accepted){const c=core(x);if(!c)continue;if(c===a)return 2;const tol=c.length>=10?2:c.length>=5?1:0;if(tol&&lev(a,c)<=tol)best=1}return best}

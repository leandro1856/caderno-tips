<style>
/* Layout: caderno de tradutor — faixa de módulo no topo, abas de modo, uma área de trabalho por vez; o texto-fonte sempre em serifa, a resposta em sans */
:root{
  --paper:#F2F4F3; --sheet:#FFFFFF; --ink:#18212B; --muted:#5A6672; --rule:#D5DCDA;
  --seal:#0E6B66; --seal-soft:#DCEDEA; --warn:#9A5B00; --warn-soft:#F6EBD9; --bad:#A3332B; --bad-soft:#F6E1DE; --good:#2E7D3A; --good-soft:#E0F0E2;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11171C; --sheet:#182128; --ink:#E6ECEA; --muted:#97A3AC; --rule:#2B3740;
  --seal:#5CC4BA; --seal-soft:#173733; --warn:#E3A84F; --warn-soft:#3A2D18; --bad:#EC8077; --bad-soft:#3D1F1C; --good:#7BCB86; --good-soft:#1C3420; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11171C; --sheet:#182128; --ink:#E6ECEA; --muted:#97A3AC; --rule:#2B3740;
  --seal:#5CC4BA; --seal-soft:#173733; --warn:#E3A84F; --warn-soft:#3A2D18; --bad:#EC8077; --bad-soft:#3D1F1C; --good:#7BCB86; --good-soft:#1C3420; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body)}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--seal)}
h1{font:600 clamp(26px,5vw,36px)/1.1 var(--f-display);margin:6px 0 0;text-wrap:balance}
.mod{display:flex;flex-direction:column;gap:4px;min-width:0}
.mod label{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;max-width:100%}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 6px}
.stat{font:400 12px var(--f-mono);color:var(--muted)}
.stat b{display:block;font:600 22px/1.2 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin-top:6px;display:flex}
.bar i{display:block;height:100%}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin:22px 0 18px;border-bottom:1px solid var(--rule)}
nav.tabs button{font:500 14px var(--f-body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;margin-bottom:-1px}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--seal)}
.panel{display:flex;flex-direction:column;gap:16px}
.hint{color:var(--muted);font-size:13.5px;margin:0;max-width:65ch}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:20px}
.src{font:400 19px/1.55 var(--f-display);margin:0}
.src em.t{font-style:normal;background:var(--seal-soft);border-radius:3px;padding:0 2px}
.model{font:400 17px/1.55 var(--f-display);font-style:italic;margin:0;border-left:3px solid var(--seal);padding-left:14px}
textarea{width:100%;min-height:120px;resize:vertical;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:500 14px var(--f-body);border-radius:6px;padding:9px 16px;cursor:pointer;border:1px solid var(--rule);background:var(--sheet);color:var(--ink)}
.btn.primary{background:var(--seal);border-color:var(--seal);color:var(--sheet)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn:disabled{opacity:.45;cursor:default}
kbd{font:500 11px var(--f-mono);border:1px solid var(--rule);border-radius:3px;padding:0 4px;color:var(--muted)}
.counter{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.05em}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks small{display:block;color:var(--muted)}
.note{background:var(--warn-soft);border-left:3px solid var(--warn);padding:10px 14px;border-radius:0 6px 6px 0;font-size:14px}
.note b{color:var(--warn);font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
/* flashcard */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;min-height:250px;padding:28px 24px;display:flex;flex-direction:column;gap:12px;justify-content:center;text-align:center;cursor:pointer;position:relative}
.card .box{position:absolute;top:12px;right:14px;font:500 11px var(--f-mono);color:var(--muted)}
.card .front{font:600 clamp(22px,4.5vw,30px)/1.25 var(--f-display);text-wrap:balance}
.card .back{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--rule);padding-top:14px}
.card .ans{font:600 20px/1.3 var(--f-display);color:var(--seal)}
.card .syn{font-size:13.5px;color:var(--muted)}
.card .ex{font:italic 15px/1.45 var(--f-display)}
.card .ex span{display:block;font-style:normal;font-family:var(--f-body);font-size:13px;color:var(--muted)}
.card .note{text-align:left}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{font:500 13px var(--f-body);border:0;background:var(--sheet);color:var(--muted);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--sheet)}
/* quiz */
.q{font:600 22px/1.3 var(--f-display);margin:0;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:400 15px var(--f-body);padding:12px 14px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.feedback{font-size:14px}
.feedback .ex{font:italic 15px var(--f-display)}
.cloze{font:400 19px/1.6 var(--f-display);margin:0}
.cloze .gap{display:inline-block;min-width:7em;border-bottom:2px solid var(--seal);color:var(--seal);font-style:italic}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}
/* glossary */
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--rule)}
th{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--paper);position:sticky;top:0}
td.n{font:400 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
td .pt{font:600 15px var(--f-display)}
td .lv{font:500 11px var(--f-mono);color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.done{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.done .big{font:600 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
@media (max-width:520px){.card{padding:24px 16px}.sheet{padding:16px}}
@media (prefers-reduced-motion:no-preference){.card,.opt,.btn{transition:background-color .15s,border-color .15s}}
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-top:14px}
.filters .mod{flex:1 1 220px}
.filters select{width:100%}
.chip{display:inline-block;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--seal);background:var(--seal-soft);border-radius:3px;padding:2px 6px}
.info{font-size:13.5px;color:var(--muted);text-align:left;border-left:3px solid var(--rule);padding-left:10px}
.notes{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:18px;font-size:14px;max-width:72ch}
details.sheet summary{cursor:pointer;font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--seal)}
details.sheet[open] summary{margin-bottom:10px}
tr.sec td{background:var(--paper);font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--seal)}
.src.en,.model.en{font-style:normal}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>

cit","The court annulled the resolution due to a severe flaw in representation.","O tribunal anulou a resolução devido a um grave vício de representatividade.","",0,""],["Abuso de direito","Abuse of rights","Abuse of process, Abuse of legal right","Exercising a strike arbitrarily may constitute an abuse of rights.","O exercício da greve de forma arbitrária pode configurar abuso de direito.","",0,""],["Ministério Público do Trabalho (MPT)","Labor Public Prosecution Service / Labor Prosecution Office","Office of the Labor Prosecutor","The Labor Public Prosecution Service intervened to mediate the labor dispute.","O Ministério Público do Trabalho interveio para mediar o litígio laboral.","Em tradução pública, na primeira ocorrência dá para manter o original entre parênteses: “Labor Prosecution Office (Ministério Público do Trabalho – MPT)”.",0,""],["Pleito (assembleia/eleição)","Dispute / Electoral contest / Proceeding","Ballot, Vote","The union leadership announced the official results of the electoral contest.","A diretoria sindical anunciou os resultados oficiais do pleito.","“Pleito” muda conforme o contexto: eleição → election/contest; demanda → claim/dispute.",0,""],["Poder de barganha","Bargaining power","Negotiating leverage","Unionization significantly increases workers' collective bargaining power.","A sindicalização aumenta significativamente o poder de barganha coletiva dos trabalhadores.","",0,""],["Boa-fé objetiva","Objective good faith","Fair dealing, Good faith principle","Contractual negotiations must be conducted under strict objective good faith.","Negociações contratuais devem ser conduzidas sob estrita boa-fé objetiva.","",0,""],["Ditames constitucionais","Constitutional tenets / Constitutional mandates","Constitutional dictates","All labor regulations must fully comply with constitutional tenets.","Todas as normas laborais devem cumprir integralmente os ditames constitucionais.","",0,""],["Empregado / Trabalhador","Employee / Worker","Staff member a contratação de trabalhadores com deficiência.","",0,""],["Jornada de trabalho","Working hours / Work shift","Hours of work","Maximum weekly working hours are strictly capped by labor regulations.","A jornada máxima de trabalho semanal é rigorosamente limitada pelas normas trabalhistas.","",0,""],["Horas extraordinárias","Overtime hours","Extra hours","Employees working beyond shift limits are entitled to overtime pay.","Empregados que trabalham além dos limites do turno têm direito ao pagamento de horas extras.","",0,""],["Adicional noturno","Night shift differential","Night work premium","Laborers working between 10 PM and 5 AM receive a night shift differential.","Trabalhadores que atuam entre 22h e 5h recebem adicional noturno.","",0,""],["Insalubridade","Unhealthy working conditions / Unhealthiness","Hazardous working conditions","Workers exposed to chemical hazards are paid an unhealthy working conditions allowance.","Trabalhadores expostos a riscos químicos recebem um adicional de insalubridade.","O material diz “unhealthiness bonus”, que é bem literal. “Unhealthy working conditions allowance” soa mais natural.",0,""],["Periculosidade","Hazard pay / Hazardousness","Dangerous working conditions","Electricians operating in high-voltage grids qualify for hazard pay.","Eletricistas que operam em redes de alta tensão qualificam-se para o adicional de periculosidade.","Não confunda: periculosidade = risco de morte/acidente (hazard pay); insalubridade = dano à saúde.",0,""],["Acidente de trabalho","Workplace accident / Industrial accident","Occupational injury","The employer is strictly liable for failing to prevent a severe workplace accident.","O empregador responde objetivamente por não ter evitado um grave acidente de trabalho.","Responder objetivamente = to be strictly liable.",0,""],["Doença ocupacional","Occupational disease","Work-related illness","Repetitive strain injury is recognized as a common occupational disease.","A lesão por esforço repetitivo é reconhecida como uma doença ocupacional comum.","",0,""],["Assédio moral","Workplace bullying / Moral harassment","Psychological harassment","Employers must maintain an environment free from workplace bullying.","Os empregadores devem manter um ambiente livre de assédio moral.","",0,""],["Assédio sexual","Sexual harassment","Workplace sexual harassment","Zero tolerance policies apply to any form of sexual harassment.","Políticas de tolerância zero aplicam-se a qualquer forma de assédio sexual.","",0,""],["Terceirização","Outsourcing / Subcontracting","Third-party contracting","Outsourcing of core activities is strictly regulated by recent statutes.","A terceirização de atividades-fim é rigorosamente regulada por estatutos recentes.","Atividade-fim = core activity; atividade-meio = non-core / support activity.",0,""],["Trabalhador autônomo","Independent contractor / Self-employed worker","Freelance worker","Independent contractors do not enjoy standard employment benefit protections.","Trabalhadores autônomos não desfrutam de proteções de benefícios trabalhistas padrão.","",0,""],["Vínculo empregatício","Employment relationship / Employment bond","Employment link","The plaintiff filed a lawsuit to recognize an underlying employment relationship.","O autor ajuizou ação para reconhecer o vínculo empregatício subjacente.","O material lista “master-servant relationship” como sinônimo, mas é termo arcaico da common law. Evite em texto moderno.",0,""],["Carteira de trabalho","Work card / Employment record book","Labor booklet","Formal registration requires entering the contract into the employee's work card.","O registro formal exige a anotação do contrato na carteira de trabalho do empregado.","Em documento oficial: “Work and Social Security Card (CTPS)”.",0,""],["Férias remuneradas","Paid annual leave","Paid vacation","Every worker is entitled to thirty days of paid annual leave per year.","Todo trabalhador tem direito a trinta dias de férias remuneradas por ano.","",0,""],["Décimo terceiro salário","Thirteenth-month salary","Christmas bonus, Year-end bonus","The law mandates the payment of a thirteenth-month salary in December.","A lei obriga o pagamento do décimo terceiro salário em dezembro.","“Christmas bonus” é informal e sugere algo opcional. Em texto jurídico, use “thirteenth-month salary”.",0,""],["FGTS","Severance Indemnity Fund for Employees","Mandatory severance savings fund","Employers must monthly deposit eight percent of wages into the employee's FGTS.","Os empregadores devem depositar mensalmente oito por cento dos salários no FGTS do empregado.","Na tradução pública, mantenha a sigla: “FGTS (Severance Indemnity Fund)”.",0,""],["Seguro-desemprego","Unemployment insurance / Unemployment benefits","Jobseeker's allowance","Laid-off workers meeting criteria can apply for state unemployment insurance.","Trabalhadores demitidos que cumprem os critérios podem solicitar o seguro-desemprego estatal.","",0,""],["Greve abusiva","Unlawful strike / Abusive strike","Illegal strike action","The labor court declared the ongoing transport strike unlawful.","A justiça do trabalho declarou abusiva a greve de transportes em andamento.","",0,""],["Piquete","Picket line","Picketing group","Strikers formed a peaceful picket line outside the corporate headquarters.","Os grevistas formaram um piquete pacífico fora da sede corporativa.","",0,""],["Lockout (paralisação patronal)","Employer lockout","Management lockout","Employer lockouts are prohibited under Brazilian strike law.","O lockout patronal é proibido pela lei de greve brasileira.","Correção do material: a proibição do lockout está no art. 17 da Lei 7.783/89 (Lei de Greve), não na Constituição.",0,""],["Comissão de conciliação prévia","Prior conciliation commission","Pre-litigation settlement board","Disputed claims can be submitted to a prior conciliation commission.","Reivindicações controvertidas podem ser submetidas a uma comissão de conciliação prévia.","",0,""],["Arbitragem trabalhista","Labor arbitration","Industrial arbitration","Collective labor disputes can be resolved via binding labor arbitration.","Conflitos coletivos de trabalho podem ser resolvidos por via de arbitragem trabalhista vinculante.","",0,""],["Reclamação trabalhista","Labor claim / Labor lawsuit","Employment suit","The former worker filed a labor claim demanding unpaid overtime.","O ex-trabalhador ajuizou reclamação trabalhista exigindo horas extras não pagas.","",0,""],["Ônus da prova","Burden of proof","Evidentiary burden","Employers bear the burden of proof regarding recorded working hours.","Os empregadores arcam com o ônus da prova referente aos horários de trabalho registrados.","",0,""],["Prescrição quinquenal / bienal","Five-year / two-year limitation period","Statute of limitations","Labor claims are subject to a five-year limitation period during employment and two years post-termination.","Reclamações trabalhistas estão sujeitas ao prazo prescricional quinquenal durante o contrato e bienal pós-rescisão.","",0,""],["Solidariedade trabalhista","Joint and several liability","Joint labor liability","Corporate groups face joint and several liability for unpaid labor debts.","Grupos econômicos enfrentam solidariedade trabalhista por débitos laborais não quitados.","",0,""],["Sucessão trabalhista","Labor succession / Transfer of business enterprise","Successor employer liability","The acquiring company assumed full liability through labor succession.","A empresa sucessora assumiu total responsabilidade por meio da sucessão trabalhista.","",0,""],["Negociação coletiva","Collective bargaining","Collective negotiation","Robust collective bargaining prevents unnecessary industrial conflicts.","A negociação coletiva robusta evita conflitos industriais desnecessários.","",0,""],["Norma mais favorável","Most favorable standard principle","Principle of the most favorable rule","Conflicts between norms are resolved applying the most favorable standard principle.","Conflitos entre normas resolvem-se aplicando o princípio da norma mais favorável.","",0,""],["Irrenunciabilidade de direitos","Inalienability of labor rights / Non-waivability of rights","Waiver restriction","Labor rights possess statutory inalienability to protect vulnerable workers.","Os direitos trabalhistas possuem irrenunciabilidade legal para proteger trabalhadores vulneráveis.","",0,""],["Indenização por danos morais","Compensation for non-pecuniary damage / Moral damages award","Pain and suffering damages","The court ordered compensation for non-pecuniary damage due to workplace harassment.","O tribunal determinou indenização por danos morais devido a assédio no ambiente de trabalho.","“Moral damages” é decalque e pode confundir leitor anglófono. “Non-pecuniary damage” é o termo seguro.",0,""],["Salário-mínimo","Minimum wage","Statutory floor wage","The national minimum wage must cover basic living expenses under the law.","O salário-mínimo nacional deve cobrir despesas básicas de subsistência por força de lei.","",0,""]],"paragraphs":[{"pt":"A deflagração de greves e a deliberação em assembleia geral de trabalhadores constituem pilares fundamentais da liberdade sindical e da democracia participativa nas relações de trabalho.","en":"The instigation of strikes and deliberation in a general assembly of workers constitute fundamental pillars of trade union freedom and participatory democracy in labor relations.","note":"“Instigation” também sugere incitação. Numa versão natural, “The calling of strikes” funciona melhor e evita ruído para o examinador.","terms":[1,2,3]},{"pt":"Conforme preconiza a legislação laboral e a jurisprudência pátria, a convocação da assembleia deve observar estritamente o estatuto social da entidade sindical e os prazos de antecedência legal, garantindo ampla publicidade a toda a categoria profissional.","en":"As advocated by labor legislation and domestic jurisprudence, the convening of the assembly must strictly observe the union’s bylaws and statutory advance notice periods, ensuring broad publicity to the entire professional category.","note":"“Jurisprudência pátria” = domestic case law. Em inglês, “jurisprudence” costuma significar teoria do direito; “case law” é mais preciso.","terms":[4,5,6,7]},{"pt":"Durante o conclave, os obreiros discutem pautas cruciais, tais como a rejeição ou acolhimento de proposta patronal de acordo coletivo, a instituição de fundo de greve e a eleição de comissões de negociação paritária.","en":"During the meeting, workers discuss crucial agendas, such as the rejection or acceptance of an employer collective agreement proposal, the establishment of a strike fund, and the election of parity negotiation committees.","terms":[8,9,10,11]},{"pt":"Cumpre ressaltar que o quórum de deliberação e a exigência de votação secreta revestem-se de imperativa formalidade para conferir validade jurídica às decisões tomadas, coibindo vícios de representatividade e abusos de direito.","en":"It is worth noting that the deliberation quorum and the requirement of secret ballot are invested with mandatory formality to confer legal validity upon the decisions made, curbing flaws in representation and abuses of rights.","terms":[12,13,14,15]},{"pt":"Por conseguinte, a patronal e o Ministério Público do Trabalho acompanham com cautela os desdobramentos desses pleitos, visando assegurar a continuidade dos serviços essenciais e o respeito irrestrito ao direito de greve, sem prejuízo da ordem pública e da paz social.","en":"Consequently, the employers’ side and the Labor Public Prosecution Service closely monitor the developments of these disputes, aiming to ensure the continuity of essential services and unrestricted respect for the right to strike, without prejudice to public order and social peace.","terms":[16,17]},{"pt":"Assim, o equilíbrio entre o poder de barganha coletiva dos empregados e a estabilidade econômica das empresas pressupõe um diálogo institucional transparente, pautado pela boa-fé objetiva e pelo respeito mútuo aos ditames constitucionais.","en":"Thus, the balance between employees’ collective bargaining power and companies’ economic stability presupposes transparent institutional dialogue, guided by objective good faith and mutual respect for constitutional tenets.","terms":[18,19,20]}],"notes":[]},{"id":"sobrevivencia","title":"Lista de Sobrevivência","source":"Lista de Sobrevivência Legal English.docx","sections":["Verbos: Documentos e contratos","Verbos: Obrigações e direitos","Verbos: Processo e decisões","Verbos: Responsabilidade e efeitos","Verbos: Leis e sociedades","Substantivos jurídicos indispensáveis","Expressões jurídicas para memorizar em blocos","Pares terminológicos que evitam erros graves","Conectores para ganhar velocidade"],"glossary":[["celebrar um contrato","to enter into a contract","","","","",0,""],["redigir","to draft","","","","",0,""],["assinar / formalizar","to sign / execute","","","","",0,""],["outorgar","to grant","","","","",0,""],["emitir","to issue","","","","",0,""],["protocolar / apresentar formalmente","to file","","","","",0,""],["cumprir uma obrigação","to fulfill / perform an obligation","","","","",1,""],["descumprir","to breach","","","","",1,""],["violar um direito ou norma","to violate / infringe","","","","",1,""],["renunciar a um direito","to waive a right","","","","",1,""],["autorizar","to authorize","","","","",1,""],["obrigar-se a","to undertake to","","","","",1,""],["ajuizar uma ação","to bring / file an action","","","","",2,""],["recorrer de uma decisão","to appeal a decision","","","","",2,""],["proferir uma decisão","to issue / render a decision","","","","",2,""],["determinar","to order","","","","",2,""],["conceder","to grant","","","","",2,""],["indeferir / rejeitar","to deny / dismiss","","","","",2,""],["responsabilizar alguém","to hold someone liable","","","","",3,""],["indenizar","to compensate / indemnify","","","","",3,""],["causar danos","to cause damage / harm","","","","",3," cial","Trade retaliation","","The measures could trigger trade retaliation.","As medidas podem desencadear uma retaliação comercial.","",4,"Resposta a medidas comerciais de outro país."],["Cadeias globais de suprimentos","Global supply chains","","Tariffs could disrupt global supply chains.","As tarifas podem prejudicar as cadeias globais de suprimentos.","",4,"Redes internacionais de produção e fornecimento."],["Custos de importação","Import costs","","","","",4,"Custos associados à importação."],["Preços ao consumidor","Consumer prices","","The new tariffs could drive up consumer prices.","As novas tarifas podem elevar os preços ao consumidor.","",4,"Preços pagos pelos consumidores."],["Inflação","Inflation","","","","",4,"Aumento generalizado dos preços."],["Acordo comercial","Trade agreement","","","","",4,"Acordo entre países ou blocos."],["Negociações comerciais","Trade negotiations","","","","",4,"Negociações relacionadas ao comércio."],["Determinar","To order / to determine","","To order the freezing of assets","","",5,""],["Autorizar","To authorize","","To authorize access to records","","",5,""],["Afastar","To lift / to waive","","To lift bank secrecy","","",5,""],["Interceptar","To intercept","","To intercept communications","","",5,""],["Divulgar","To disclose","","To disclose confidential information","","",5,""],["Revelar","To reveal","","To reveal financial information","","",5,""],["Obter","To obtain","","To obtain bank records","","",5,""],["Congelar","To freeze","","To freeze assets","","",5,""],["Bloquear","To block","","To block transactions","","",5,""],["Apreender","To seize","","To seize property","","",5,""],["Confiscar","To confiscate / to forfeit","","To confiscate assets","","",5,""],["Restringir","To restrict","","To restrict trade","","",5,""],["Impor","To impose","","To impose sanctions","","",5,""],["Aplicar","To impose / to enforce","","To impose penalties","","",5,""],["Suspender","To suspend","","To suspend sanctions","","",5,""],["Revogar","To revoke / to repeal","","To revoke an authorization / repeal a law","","",5,""],["Contornar","To circumvent","","To circumvent sanctions","","",5,""],["Cumprir","To comply with","","To comply with a court order","","",5,""],["Violar","To violate / to breach","","To violate confidentiality rules","","",5,""],["Investigar","To investigate","","To investigate suspicious transactions","","",5,""],["Rastrear","To trace","","To trace illicit funds","","",5,""],["Proibir","To prohibit / to ban","","To prohibit certain transactions","","",5,""],["Retaliar","To retaliate","","To retaliate against trade restrictions","","",5,""],["Elevar","To raise / to increase","","To raise tariffs","","",5,""],["Prejudicar","To harm / to undermine","","To undermine economic growth","","",5,""],["Apreensão","Seizure","","","","Não equivale automaticamente a congelamento.",6,""],["Perda ou confisco de bens, conforme o contexto jurídico","Forfeiture","","","","Não é sinônimo genérico de bloqueio.",6,""],["Divulgação ou revelação","Disclosure","","","","Não significa necessariamente quebra de sigilo por ordem judicial.",6,""],["Prova / evidência","Evidence","","","","Em processo jurídico, geralmente prefira “prova” em português.",6,""],["Por fim / finalmente","Eventually","","","","Não significa “eventualmente”.",6,""],["Real / efetivo","Actual","","","","Não significa “atual”.",6,""],["Imposto por fim","Eventually imposed","","","","Não “imposto eventualmente”, se o sentido for temporal.",6,""],["Política / diretriz","Policy","","","","Não significa necessariamente “polícia”.",6,""],["Sanções abrangentes","Comprehensive sanctions","","","","Não significa “sanções compreensivas”.",6,""],["Ativos / bens / patrimônio","Assets","","","","A tradução depende do tipo de ativo e do contexto.",6,""],["Dever ou tarifa/tributo aduaneiro","Duty","","","","Em customs duty, significa direito aduaneiro ou imposto de importação, conforme o contexto.",6,""],["Alegação, reivindicação ou pedido","Claim","","","","Não significa automaticamente “reclamação”.",6,""],["Ordem / determinação / decisão","Order","","","","Em contexto judicial, pode ser “ordem judicial”.",6,""]],"paragraphs":[{"pt":"O governo anunciou um tarifaço sobre produtos importados.","en":"The government announced steep tariff increases on imported goods.","label":"Frase de alto rendimento"},{"pt":"As novas tarifas podem elevar os preços ao consumidor.","en":"The new tariffs could drive up consumer prices.","label":"Frase de alto rendimento"},{"pt":"O país impôs tarifas retaliatórias.","en":"The country imposed retaliatory tariffs.","label":"Frase de alto rendimento"},{"pt":"A medida intensificou a guerra comercial.","en":"The measure escalated the trade war.","label":"Frase de alto rendimento"},{"pt":"As empresas enfrentam custos mais elevados.","en":"Businesses are facing higher costs.","label":"Frase de alto rendimento"},{"pt":"Os países recorreram a medidas protecionistas.","en":"The countries resorted to protectionist measures.","label":"Frase de alto rendimento"},{"pt":"As tarifas podem prejudicar as cadeias globais de suprimentos.","en":"Tariffs could disrupt global supply chains.","label":"Frase de alto rendimento"},{"pt":"A decisão provocou tensões diplomáticas.","en":"The decision triggered diplomatic tensions.","label":"Frase de alto rendimento"},{"pt":"O governo pretende proteger a indústria nacional.","en":"The government aims to protect domestic industry.","label":"Frase de alto rendimento"},{"pt":"As medidas podem desencadear uma retaliação comercial.","en":"The measures could trigger trade retaliation.","label":"Frase de alto rendimento"},{"pt":"Por que você escolheu “asset freeze” em vez de “confiscation”? (Responda em inglês.)","en":"I chose asset freeze because it refers to restricting access to or dealings with assets, whereas confiscation generally involves the permanent loss of property under the applicable legal framework. The terms are not interchangeable.","note":"Pergunta em inglês: Why did you choose “asset freeze” rather than “confiscation”?","label":"Arguição"},{"pt":"Como você traduziria “quebra de sigilo bancário”? (Responda em inglês.)","en":"I would generally use lifting of bank secrecy. However, if the context specifically refers to the disclosure of bank records, I would consider disclosure of banking information to convey the precise legal meaning.","note":"Pergunta em inglês: How would you translate “quebra de sigilo bancário”?","label":"Arguição"},{"pt":"Como traduzir “tarifaço” em um discurso formal? (Responda em inglês.)","en":"I would avoid a literal translation and use steep tariff increases or sharp tariff hikes. These expressions convey the idea of a substantial increase in import tariffs in natural, formal English.","note":"Pergunta em inglês: How would you translate “tarifaço” in a formal speech?","label":"Arguição"},{"pt":"Qual é a diferença entre “telephone records” e “telephone interception”? (Responda em inglês.)","en":"Telephone records refer to information about calls, such as their dates, times and numbers. Telephone interception, by contrast, involves capturing communications themselves. The distinction is important for terminological accuracy.","note":"Pergunta em inglês: What is the difference between “telephone records” and “telephone interception”?","label":"Arguição"}],"notes":["Uma distinção essencial para a prova: telephone tapping, disclosure of bank records e asset freeze não são expressões intercambiáveis. O contexto jurídico determina a tradução adequada.","Telephone records: registros das ligações.","Telephone interception: interceptação do conteúdo das comunicações.","Disclosure of telephone records: fornecimento ou divulgação dos registros telefônicos.","Lifting of telephone secrecy: expressão descritiva para o afastamento do sigilo, que pode exigir adaptação conforme o contexto.","A legislação brasileira sobre interceptações telefônicas é uma referência útil para reconhecer essa distinção terminológica.","Atenção à diferença jurídica: freezing/blocking não significa necessariamente confiscation. No regime administrado pelo OFAC, por exemplo, o bloqueio restringe as operações com o bem, mas não transfere automaticamente sua propriedade ao governo.","A palavra tarifaço é coloquial em português. Em uma tradução formal, prefira steep tariff increases, sharp tariff hikes ou sweeping tariff increases, conforme o contexto.","Estratégia de memorização: priorize primeiro os pares freeze/block, seize/confiscate, records/interception, sanctions/tariffs e disclosure/confidentiality. Depois, treine as combinações verbais e as quatro respostas de arguição em voz alta. Essa sequência ajuda a recuperar a terminologia com rapidez durante a prova oral TIPS."]},{"id":"terras-raras","title":"Minerais Críticos (notícia)","source":"Terras Raras.pdf (Agência Brasil, out/2026)","sections":["Mineração e mercado de trabalho","Minerais","Verbos e conectores de notícia"],"glossary":[["minerais críticos e estratégicos","critical and strategic minerals","","The data are available on the Critical and Strategic Minerals Portal, launched last week by the National Mining Agency (ANM).","Os dados estão disponíveis no Portal de Minerais Críticos e Estratégicos, lançado na última semana pela Agência Nacional de Mineração (ANM).","",0,""],["indústria extrativa mineral","mineral extractive industry","mining industry","Activities related to the critical and strategic minerals (CSM) sector in Brazil accounted for 129,423 jobs in 2025, equivalent to 57% of the 226,634 jobs in the country's mineral extractive industry.","As atividades relacionadas ao setor de minerais críticos e estratégicos (MCE) para o Brasil somaram 129.423 empregos, em 2025, o equivalente a 57% dos 226.634 empregos da indústria extrativa mineral do país.","",0,""],["postos de trabalho","jobs","job positions, positions","Women hold the remaining 22%, or 28,658 jobs.","As mulheres ocupam os 22% restantes, 28.658 postos.","",0,""],["mercado de trabalho","labor market","","Compared with the same labor market recorded in 2023, there was an 8.6% increase over the period.","Quando comparado ao mesmo mercado de trabalho registrado em 2023, houve crescimento de 8,6% no período.","",0,""],["mercado formal de trabalho","formal labor market","","The platform's analysis of the formal labor market in the mineral extractive industry was based on microdata from the Annual Social Information Report (RAIS) and the New General Register of Employed and Unemployed Persons (Novo Caged), made available by the Ministry of Labor and Employment (MTE).","A análise do mercado formal de trabalho da indústria extrativa mineral da plataforma foi realizada a partir dos microdados da Relação Anual de Informações Sociais (Rais) e do Novo Cadastro Geral de Empregados e Desempregados (Novo Caged), disponibilizados pelo Ministério do Trabalho e Emprego (MTE).","",0,""],["Agência Nacional de Mineração (ANM)","National Mining Agency (ANM)","","The data are available on the Critical and Strategic Minerals Portal, launched last week by the National Mining Agency (ANM).","Os dados estão disponíveis no Portal de Minerais Críticos e Estratégicos, lançado na última semana pela Agência Nacional de Mineração (ANM).","",0,""],["unidades da federação","states / federative units","","The states that employ the most are Minas Gerais (62,631 jobs), Pará (27,047) and Bahia (9,147).","As unidades da federação que mais empregam são Minas Gerais (62.631 postos de trabalho); Pará (27.047); e Bahia (9.147).","",0,""],["painel","dashboard","panel","In addition to employment data, the dashboard provides information on the workforce profile, average pay and the 21 substances related to these activities, including aluminum, gold, iron, copper, rare earths, niobium, titanium and lithium.","Além dos dados sobre empregos, o painel permite consultar informações sobre o perfil dos trabalhadores, remuneração média e as 21 substâncias relacionadas a essas atividades, entre elas, alumínio, ouro, ferro, cobre, terras-raras, nióbio, titânio e lítio.","",0,""],["perfil dos trabalhadores","workforce profile","worker profile","In addition to employment data, the dashboard provides information on the workforce profile, average pay and the 21 substances related to these activities, including aluminum, gold, iron, copper, rare earths, niobium, titanium and lithium.","Além dos dados sobre empregos, o painel permite consultar informações sobre o perfil dos trabalhadores, remuneração média e as 21 substâncias relacionadas a essas atividades, entre elas, alumínio, ouro, ferro, cobre, terras-raras, nióbio, titânio e lítio.","",0,""],["remuneração média","average pay","average earnings, average wage","In 2025, the average pay of workers with primary, secondary and higher education was R$3,218, R$4,142 and R$11,856, respectively.","Em 2025, as remunerações médias dos trabalhadores de níveis de escolaridade fundamental, médio e superior foram respectivamente de R$ 3.218; R$ 4.142 e R$ 11.856.","",0,""],["microdados","microdata","","The platform's analysis of the formal labor market in the mineral extractive industry was based on microdata from the Annual Social Information Report (RAIS) and the New General Register of Employed and Unemployed Persons (Novo Caged), made available by the Ministry of Labor and Employment (MTE).","A análise do mercado formal de trabalho da indústria extrativa mineral da plataforma foi realizada a partir dos microdados da Relação Anual de Informações Sociais (Rais) e do Novo Cadastro Geral de Empregados e Desempregados (Novo Caged), disponibilizados pelo Ministério do Trabalho e Emprego (MTE).","",0,""],["Relação Anual de Informações Sociais (RAIS)","Annual Social Information Report (RAIS)","","The platform's analysis of the formal labor market in the mineral extractive industry was based on microdata from the Annual Social Information Report (RAIS) and the New General Register of Employed and Unemployed Persons (Novo Caged), made available by the Ministry of Labor and Employment (MTE).","A análise do mercado formal de trabalho da indústria extrativa mineral da plataforma foi realizada a partir dos microdados da Relação Anual de Informações Sociais (Rais) e do Novo Cadastro Geral de Empregados e Desempregados (Novo Caged), disponibilizados pelo Ministério do Trabalho e Emprego (MTE).","",0,""],["Ministério do Trabalho e Emprego (MTE)","Ministry of Labor and Employment (MTE)","","The platform's analysis of the formal labor market in the mineral extractive industry was based on microdata from the Annual Social Information Report (RAIS) and the New General Register of Employed and Unemployed Persons (Novo Caged), made available by the Ministry of Labor and Employment (MTE).","A análise do mercado formal de trabalho da indústria extrativa mineral da plataforma foi realizada a partir dos microdados da Relação Anual de Informações Sociais (Rais) e do Novo Cadastro Geral de Empregados e Desempregados (Novo Caged), disponibilizados pelo Ministério do Trabalho e Emprego (MTE).","",0,""],["mão de obra qualificada","skilled workers / skilled labor","skilled workforce","In the chart of CSM-related jobs, 51,714 are held by skilled workers, equivalent to 23% of all jobs.","No gráfico de empregos, relacionados aos MCE, 51.714 são de mão de obra qualificada, o equivalente a 23% de todos os empregos.","",0,""],["ensino superior / nível superior","higher education / university degree","","Workers with higher education total 30,707, or 14%.","Os trabalhadores com ensino superior somam 30.707, que representa 14%.","",0,""],["ensino fundamental","primary education","elementary school","","","",0,""],["ensino médio","secondary education","high school","","","",0,""],["nível de escolaridade","education level","educational attainment","","","",0,""],["metais preciosos","precious metals","","When jobs are broken down by type of mineral, iron mining employs the most people (70,027 jobs .","",1,""],["ferro","iron","","When jobs are broken down by type of mineral, iron mining employs the most people (70,027 jobs), followed by precious metals, with a total of 21,313 jobs.","Quando considerados os empregos gerados por tipo de mineral, o extrativismo que mais emprega é do ferro (70.027 postos de trabalho). Seguido por metais preciosos que somam 21.313 empregos.","",1,""],["ouro","gold","","In addition to employment data, the dashboard provides information on the workforce profile, average pay and the 21 substances related to these activities, including aluminum, gold, iron, copper, rare earths, niobium, titanium and lithium.","Além dos dados sobre empregos, o painel permite consultar informações sobre o perfil dos trabalhadores, remuneração média e as 21 substâncias relacionadas a essas atividades, entre elas, alumínio, ouro, ferro, cobre, terras-raras, nióbio, titânio e lítio.","",1,""],["extrativismo mineral","mining / mineral extraction","","The data are available on the Critical and Strategic Minerals Portal, launched last week by the National Mining Agency (ANM).","Os dados estão disponíveis no Portal de Minerais Críticos e Estratégicos, lançado na última semana pela Agência Nacional de Mineração (ANM).","",1,""],["somar (empregos)","to account for / to total","to add up to","Workers with higher education total 30,707, or 14%.","Os trabalhadores com ensino superior somam 30.707, que representa 14%.","",2,""],["equivaler a","to be equivalent to / to account for","to represent","According to the portal's data, men (100,765 jobs) account for 78% of all jobs related to critical and strategic minerals (129,423).","De acordo com os dados do portal, a participação masculina (100.765 empregos) equivale a 78% do total de empregos relacionados a minerais críticos e estratégicos (129.423).","",2,""],["ocupar (postos)","to hold (jobs)","to fill","Women hold the remaining 22%, or 28,658 jobs.","As mulheres ocupam os 22% restantes, 28.658 postos.","",2,""],["disponibilizar","to make available","to provide","","","",2,""],["respectivamente","respectively","","In 2025, the average pay of workers with primary, secondary and higher education was R$3,218, R$4,142 and R$11,856, respectively.","Em 2025, as remunerações médias dos trabalhadores de níveis de escolaridade fundamental, médio e superior foram respectivamente de R$ 3.218; R$ 4.142 e R$ 11.856.","",2,""],["restantes","remaining","","Women hold the remaining 22%, or 28,658 jobs.","As mulheres ocupam os 22% restantes, 28.658 postos.","",2,""],["seguido por","followed by","","When jobs are broken down by type of mineral, iron mining employs the most people (70,027 jobs), followed by precious metals, with a total of 21,313 jobs.","Quando considerados os empregos gerados por tipo de mineral, o extrativismo que mais emprega é do ferro (70.027 postos de trabalho). Seguido por metais preciosos que somam 21.313 empregos.","",2,""],["de acordo com","according to","","According to the indicators, in 2025 the country had 1,012 producing areas, which generated R$250.4 billion.","De acordo com os indicadores, em 2025 o país tinha 1.012 áreas em produção que resultaram em R$ 250,4 bilhões ao país.","",2,""],["lançar (um portal)","to launch","","","","",2,""]],"paragraphs":[{"pt":"As atividades relacionadas ao setor de minerais críticos e estratégicos (MCE) para o Brasil somaram 129.423 empregos, em 2025, o equivalente a 57% dos 226.634 empregos da indústria extrativa mineral do país.","en":"Activities related to the critical and strategic minerals (CSM) sector in Brazil accounted for 129,423 jobs in 2025, equivalent to 57% of the 226,634 jobs in the country's mineral extractive industry.","note":"Modelo de versão feito por Claude. Números: 129.423 → 129,423. Em inglês, ponto e vírgula se invertem."},{"pt":"Quando comparado ao mesmo mercado de trabalho registrado em 2023, houve crescimento de 8,6% no período. Os dados estão disponíveis no Portal de Minerais Críticos e Estratégicos, lançado na última semana pela Agência Nacional de Mineração (ANM).","en":"Compared with the same labor market recorded in 2023, there was an 8.6% increase over the period. The data are available on the Critical and Strategic Minerals Portal, launched last week by the National Mining Agency (ANM).","note":"Modelo de versão feito por Claude. 8,6% → 8.6%. \"Na última semana\" = last week."},{"pt":"As unidades da federação que mais empregam são Minas Gerais (62.631 postos de trabalho); Pará (27.047); e Bahia (9.147).","en":"The states that employ the most are Minas Gerais (62,631 jobs), Pará (27,047) and Bahia (9,147).","note":"Modelo de versão feito por Claude. \"Unidades da federação\" = states (ou federative units, mais formal)."},{"pt":"Além dos dados sobre empregos, o painel permite consultar informações sobre o perfil dos trabalhadores, remuneração média e as 21 substâncias relacionadas a essas atividades, entre elas, alumínio, ouro, ferro, cobre, terras-raras, nióbio, titânio e lítio.","en":"In addition to employment data, the dashboard provides information on the workforce profile, average pay and the 21 substances related to these activities, including aluminum, gold, iron, copper, rare earths, niobium, titanium and lithium.","note":"Modelo de versão feito por Claude."},{"pt":"A análise do mercado formal de trabalho da indústria extrativa mineral da plataforma foi realizada a partir dos microdados da Relação Anual de Informações Sociais (Rais) e do Novo Cadastro Geral de Empregados e Desempregados (Novo Caged), disponibilizados pelo Ministério do Trabalho e Emprego (MTE).","en":"The platform's analysis of the formal labor market in the mineral extractive industry was based on microdata from the Annual Social Information Report (RAIS) and the New General Register of Employed and Unemployed Persons (Novo Caged), made available by the Ministry of Labor and Employment (MTE).","note":"Modelo de versão feito por Claude. Siglas brasileiras: mantenha a sigla e dê a tradução descritiva na primeira menção."},{"pt":"De acordo com os dados do portal, a participação masculina (100.765 empregos) equivale a 78% do total de empregos relacionados a minerais críticos e estratégicos (129.423). As mulheres ocupam os 22% restantes, 28.658 postos.","en":"According to the portal's data, men (100,765 jobs) account for 78% of all jobs related to critical and strategic minerals (129,423). Women hold the remaining 22%, or 28,658 jobs.","note":"Modelo de versão feito por Claude."},{"pt":"No gráfico de empregos, relacionados aos MCE, 51.714 são de mão de obra qualificada, o equivalente a 23% de todos os empregos.","en":"In the chart of CSM-related jobs, 51,714 are held by skilled workers, equivalent to 23% of all jobs.","note":"Modelo de versão feito por Claude."},{"pt":"Os trabalhadores com ensino superior somam 30.707, que representa 14%. Destes mais de 30 mil postos de trabalho, 19.060 são ocupados por homens e 11.647, por mulheres.","en":"Workers with higher education total 30,707, or 14%. Of these more than 30,000 jobs, 19,060 are held by men and 11,647 by women.","note":"Modelo de versão feito por Claude."},{"pt":"Quando considerados os empregos gerados por tipo de mineral, o extrativismo que mais emprega é do ferro (70.027 postos de trabalho). Seguido por metais preciosos que somam 21.313 empregos.","en":"When jobs are broken down by type of mineral, iron mining employs the most people (70,027 jobs), followed by precious metals, with a total of 21,313 jobs.","note":"Modelo de versão feito por Claude."},{"pt":"Em 2025, as remunerações médias dos trabalhadores de níveis de escolaridade fundamental, médio e superior foram respectivamente de R$ 3.218; R$ 4.142 e R$ 11.856.","en":"In 2025, the average pay of workers with primary, secondary and higher education was R$3,218, R$4,142 and R$11,856, respectively.","note":"Modelo de versão feito por Claude. Fundamental/médio/superior → primary/secondary/higher education. \"Respectivamente\" vai para o fim: respectively."},{"pt":"O portal também mostra a distribuição territorial dos municípios produtores com um mapa geoespacial. Entre os municípios com maior número de trabalhadores em atividades relacionadas aos MCE estão Parauapebas (PA), com 8.234 empregos; Nova Lima (MG), com 8.218; e Congonhas (MG), com 7.114.","en":"The portal also shows the territorial distribution of producing municipalities on a geospatial map. The municipalities with the largest number of workers in CSM-related activities include Parauapebas (PA), with 8,234 jobs; Nova Lima (MG), with 8,218; and Congonhas (MG), with 7,114.","note":"Modelo de versão feito por Claude."},{"pt":"Em Parauapebas, são 8.234 trabalhadores (71,4% do gênero masculino e 28,6% do gênero feminino), sendo 1.851 com nível superior.","en":"Parauapebas has 8,234 workers (71.4% male and 28.6% female), 1,851 of whom have a university degree.","note":"Modelo de versão feito por Claude."},{"pt":"Em Nova Lima, dos 8.218 empregados (63,3% do gênero masculino e 36,7% do gênero feminino), 4.776 tem nível superior. Em Congonhas, são 7.114 trabalhadores (73,2% do gênero masculino e 26,8% gênero feminino), sendo 1.234 trabalhadores com nível superior.","en":"In Nova Lima, of the 8,218 employees (63.3% male and 36.7% female), 4,776 have a university degree. Congonhas has 7,114 workers (73.2% male and 26.8% female), 1,234 of whom have a university degree.","note":"Modelo de versão feito por Claude."},{"pt":"Para contribuir com a transparência e a divulgação de informações sobre o desempenho da mineração no país, o site apresenta informações de exploração, valor investido e produção e comércio exterior. De acordo com os indicadores, em 2025 o país tinha 1.012 áreas em produção que resultaram em R$ 250,4 bilhões ao país.","en":"To promote transparency and the dissemination of information on the performance of mining in the country, the website provides data on exploration, investment, production and foreign trade. According to the indicators, in 2025 the country had 1,012 producing areas, which generated R$250.4 billion.","note":"Modelo de versão feito por Claude. R$ 250,4 bilhões → R$250.4 billion (sem espaço depois de R$ em inglês; billion = bilhão)."}],"notes":["O material é só a notícia em português. O modelo de versão e o glossário foram preparados por Claude a partir dela.","Treino de números: em inglês, separador de milhar é vírgula e decimal é ponto (129,423; 8.6%; R$250.4 billion)."]},{"id":"ted-tarifas","title":"TED: Tarifas Alfandegárias","source":"vocabulario_TED_tarifas_DREI.pdf","sections":["Tarifas, impostos e comércio exterior","Importação, produção e mercado","Custos, preços, receitas e emprego","Causalidade, política e linguagem de análise"],"glossary":[["Tarifa alfandegária","Tariff","","Enacting a tariff kicks off a complicated economic chain reaction.","A instituição de uma tarifa alfandegária desencadeia uma complexa reação econômica em cadeia.","",0,""],["Lei tarifária","Tariff Act","","","","",0,""],["Imposto; tributo, conforme o contexto","Tax","","","","",0,""],["Direitos aduaneiros; tributos aduaneiros","Customs duties","","","","",0,""],["Alíquota da tarifa alfandegária","Tariff rate","","","","",0,""],["Com alíquotas diferentes","At different rates","","","","",0,""],["Imposto abrangente, de ampla aplicação","Sweeping tax","","","","",0,""],["Isento de tarifas alfandegárias","Tariff-free","","","","",0,""],["Mercadorias isentas de tributos aduaneiros, conforme o contexto","Duty-free goods","","","","",0,""],["Impor uma tarifa alfandegária","To impose a tariff","","","","",0,""],["Instituir uma tarifa alfandegária","To enact a tariff","","","","",0,""],["Cobrar ou lançar um tributo","To levy a tax","","","","",0,""],["Elevar tarifas alfandegárias","To raise tariffs","","","","",0,""],["Estar sujeito a uma tarifa","To face a tariff","","","","",0,""],["Reagir à imposição de uma tarifa","To respond to a tariff","","","","",0,""],["De até 30%","As high as 30%","","","","",0,"" const BOX_COL=["var(--rule)","var(--bad)","var(--warn)","var(--seal)","var(--good)"];
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function judge(answer,accepted){const a=core(answer);if(!a)return 0;let best=0;for(const x of accepted){const c=core(x);if(!c)continue;if(c===a)return 2;const tol=c.length>=10?2:c.length>=5?1:0;if(tol&&lev(a,c)<=tol)best=1}return best}

function renderStats(){
  const m=M(),all=ALL(),n=all.length,d=D();
  const counts=[0,0,0,0,0];all.forEach(t=>counts[Math.min(4,boxOf(t.i))]++);
  $("#sMast").textContent=(counts[3]+counts[4])+"/"+n;
  $("#sDue").textContent=n-counts[3]-counts[4];
  const np=m.paragraphs.length;$("#sVerBox").hidden=!np;
  $("#sVer").textContent=Object.keys(d.ver).length+"/"+np;
  $("#sQuiz").textContent=d.quizBest==null?"–":d.quizBest+"/10";
  $("#sBar").innerHTML=counts.map((c,k)=>c?`<i style="width:${c/n*100}%;background:${BOX_COL[k]}"></i>`:"").join("");
  [...$("#modSel").options].forEach(o=>{const mm=MODULES.find(x=>x.id===o.value),dd=S.data[mm.id]||{box:{}};const mast=Object.values(dd.box||{}).filter(b=>b>=3).length;o.textContent=`${mm.title} · ${mast}/${mm.glossary.length}`});
}
function fillSections(){
  const m=M(),d=D(),all=ALL();
  $("#secSel").innerHTML=`<option value="-1">Todas as seções (${all.length} termos)</option>`+m.sections.map((s,i)=>`<option value="${i}">${esc(s)} (${all.filter(t=>t.sec===i).length})</option>`).join("");
  $("#secSel").value=String(d.sec);$("#secSel").disabled=m.sections.length<2;
}

/* ===== Abas ===== */
const RENDER={versao:renderVersao,cards:renderCards,escrever:renderEscrever,quiz:renderQuiz,glossario:renderGloss};
function setTab(t){
  const hasP=M().paragraphs.length>0;
  document.querySelector('[data-tab=versao]').hidden=!hasP;
  if(t==="versao"&&!hasP)t="cards";
  S.tab=t;save();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  document.querySelectorAll(".panel").forEach(p=>p.hidden=p.id!=="p-"+t);
  RENDER[t]();
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function dirToggle(id,cb){
  const pt=S.dir==="pt";
  return {html:`<div class="seg" role="group" aria-label="Direção"><button id="${id}Pt" aria-pressed="${pt}">PT → EN</button><button id="${id}En" aria-pressed="${!pt}">EN → PT</button></div>`,
    bind(){$("#"+id+"Pt").onclick=()=>{S.dir="pt";save();cb()};$("#"+id+"En").onclick=()=>{S.dir="en";save();cb()}}};
}

/* ===== Tradução ===== */
function renderVersao(){
  const m=M(),d=D(),all=ALL(),N=m.paragraphs.length,k=Math.min(d.verIdx,N-1),p=m.paragraphs[k];
  const pt=S.dir==="pt",src=pt?p.pt:p.en,tgt=pt?p.en:p.pt;
  let srcHtml=esc(src);
  if(pt&&p.terms)p.terms.forEach(t=>{const term=all[t-1].pt.replace(/\s*\(.*\)/,"").split(" / ")[0];const re=new RegExp("("+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").slice(0,Math.max(6,term.length-3))+"[\\wà-ú]*)","i");srcHtml=srcHtml.replace(re,'<em class="t">$1</em>')});
  const tg=dirToggle("vd",renderVersao);
  const el=$("#p-versao");
  el.innerHTML=`<p class="hint">Traduza sem olhar o modelo, de preferência em voz alta, como na prova oral. Depois compare. A seção escolhida acima não filtra as frases.</p>
  <div class="row" style="justify-content:space-between">${tg.html}<div class="row"><button class="btn" id="vPrev" ${k===0?"disabled":""}>← Anterior</button><button class="btn" id="vNext" ${k===N-1?"disabled":""}>Próxima →</button></div></div>
  <div class="row"><span class="counter">${k+1} DE ${N}${d.ver[k]?" · FEITA":""}</span>${p.label?`<span class="chip">${esc(p.label)}</span>`:""}</div>
  <div class="sheet"><p class="src ${pt?"":"en"}">${srcHtml}</p></div>
  <label for="vIn" class="counter">SUA TRADUÇÃO ${pt?"EM INGLÊS":"EM PORTUGUÊS"} (opcional se estiver treinando oralmente)</label>
  <textarea id="vIn" placeholder="Escreva aqui…">${esc((d.ver[k]&&d.ver[k][S.dir])||"")}</textarea>
  <div class="row"><button class="btn primary" id="vShow">Comparar com o modelo</button></div>
  <div id="vOut" hidden class="panel"></div>`;
  $("#vPrev").onclick=()=>{d.verIdx=k-1;save();renderVersao()};
  $("#vNext").onclick=()=>{d.verIdx=k+1;save();renderVersao()};
  tg.bind();
  $("#vIn").oninput=e=>{d.ver[k]=d.ver[k]||{};d.ver[k][S.dir]=e.target.value;save()};
  $("#vShow").onclick=()=>{
    const out=$("#vOut");out.hidden=false;
    const draft=norm($("#vIn").value);
    const terms=pt&&p.terms?p.terms:null;
    out.innerHTML=`<div class="sheet panel"><span class="counter">MODELO</span><p class="model ${pt?"en":""}">${esc(tgt)}</p></div>
    ${p.note?`<div class="note"><b>Nota</b>${esc(p.note)}</div>`:""}
    ${terms?`<div class="sheet"><span class="counter">TERMOS-CHAVE · marque os que você acertou</span><div class="checks" style="margin-top:10px">
    ${terms.map(t=>{const x=all[t-1];const auto=draft&&[...alts(x.en),...alts(x.syn)].some(c=>draft.includes(norm(c)));
      return `<label><input type="checkbox" data-t="${t-1}" ${auto?"checked":""}><span><b>${esc(x.pt)}</b> → ${esc(x.en)}<small>${auto?"Encontrado na sua versão.":"Não encontrado. Confira se usou um equivalente aceitável."}</small></span></label>`}).join("")}
    </div></div>`:""}
    <div class="row"><span class="counter">COMO FOI?</span><button class="btn good" data-r="2">Acertei o sentido</button><button class="btn warn" data-r="1">Acertei em parte</button><button class="btn bad" data-r="0">Travei</button></div>`;
    out.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
      if(terms)out.querySelectorAll("input[data-t]").forEach(c=>{const i=+c.dataset.t;D().box[i]=c.checked?Math.max(boxOf(i),2):1});
      d.ver[k]=Object.assign(d.ver[k]||{},{r:+b.dataset.r});save();renderStats();
      if(k<N-1){d.verIdx=k+1;save();renderVersao();window.scrollTo({top:$("nav.tabs").offsetTop-8})}
      else{b.textContent="Registrado";out.querySelectorAll("[data-r]").forEach(x=>x.disabled=true)}
    });
  };
}

/* ===== Flashcards (Leitner, rodadas de 20) ===== */
let cq=[],cur=null,flipped=false,round={n:0,ok:0,total:0};
const PRI={1:0,2:1,0:2,3:3};
function buildQueue(){
  const g=G().filter(t=>boxOf(t.i)<4);
  const by=b=>shuffle(g.filter(t=>boxOf(t.i)===b));
  cq=[...by(1),...by(2),...g.filter(t=>boxOf(t.i)===0),...by(3)].slice(0,20);
  round={n:0,ok:0,total:cq.length};
}
function renderCards(){
  const el=$("#p-cards");
  if(!cq.length&&round.total&&round.n>=round.total){
    const left=G().filter(t=>boxOf(t.i)<4).length;
    el.innerHTML=`<div class="sheet done"><span class="counter">RODADA CONCLUÍDA</span><div class="big">${round.ok}/${round.total}</div><p class="hint">Acertos de primeira nesta rodada. Faltam ${left} termos para dominar nesta seleção.</p><button class="btn primary" id="nextRound">${left?"Próxima rodada de 20":"Revisar tudo de novo"}</button></div>`;
    $("#nextRound").onclick=()=>{if(!left){G().forEach(t=>D().box[t.i]=2);save();renderStats()}round.total=0;buildQueue();renderCards()};return;
  }
  if(!cq.length)buildQueue();
  cur=cq[0];flipped=false;
  const ptFirst=S.dir==="pt",tg=dirToggle("cd",()=>renderCards());
  if(!cur){el.innerHTML=`<div class="sheet done"><div class="big">Tudo dominado</div><p class="hint">Todos os termos desta seleção estão na última caixa.</p><button class="btn primary" id="reset">Revisar tudo de novo</button></div>`;
    $("#reset").onclick=()=>{G().forEach(t=>D().box[t.i]=2);save();renderStats();buildQueue();renderCards()};return}
  const secName=M().sections[cur.sec]||"";
  el.innerHTML=`<p class="hint">Diga a tradução em voz alta antes de virar. Rodadas de até 20 cartas: as erradas voltam na mesma rodada, as novas entram aos poucos.</p>
  <div class="row" style="justify-content:space-between">${tg.html}<span class="counter">CARTA ${round.n+1} · ${cq.length} NA RODADA</span></div>
  <div class="card" id="card" tabindex="0" aria-live="polite">
    <span class="box">${BOX_LBL[boxOf(cur.i)]}</span>
    ${M().sections.length>1?`<span class="counter">${esc(secName)}</span>`:""}
    <div class="front">${esc(ptFirst?cur.pt:cur.en)}</div>
    <div class="back" hidden id="back">
      <div class="ans">${esc(ptFirst?cur.en:cur.pt)}</div>
      ${cur.syn?`<div class="syn">Sinônimos: ${esc(cur.syn)}</div>`:""}
      ${cur.exEn?`<div class="ex">${esc(cur.exEn)}${cur.exPt?`<span>${esc(cur.exPt)}</span>`:""}</div>`:""}
      ${cur.info?`<div class="info">${esc(cur.info)}</div>`:""}
      ${cur.note?`<div class="note"><b>Atenção</b>${esc(cur.note)}</div>`:""}
    </div></div>
  <div class="row" id="rate"><button class="btn primary" id="flip">Virar carta <kbd>espaço</kbd></button></div>`;
  tg.bind();
  $("#card").onclick=flip;$("#flip").onclick=flip;
}
function flip(){
  if(flipped||!cur)return;flipped=true;$("#back").hidden=false;
  $("#rate").innerHTML=`<button class="btn bad" data-r="1">1 · Não sabia</button><button class="btn warn" data-r="2">2 · Quase</button><button class="btn good" data-r="3">3 · Sabia</button>`;
  $("#rate").querySelectorAll("button").forEach(b=>b.onclick=()=>rate(+b.dataset.r));
}
function rate(r){
  const i=cur.i,b=boxOf(i),d=D();
  if(!cur.seen&&r===3)round.ok++;
  d.box[i]=r===1?1:r===2?2:Math.min(4,Math.max(b,2)+1);
  cq.shift();
  if(r<3){cur.seen=true;cq.splice(Math.min(r===1?3:7,cq.length),0,cur)}
  else round.n++;
  if(r<3&&!cur.counted){cur.counted=true}
  if(!cq.length)round.n=round.total;
  save();renderStats();renderCards();
}
document.addEventListener("keydown",e=>{
  if(S.tab!=="cards"||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.code==="Space"){e.preventDefault();flip()}
  else if(flipped&&["1","2","3"].includes(e.key))rate(+e.key);
});

/* ===== Escrever (lacuna quando há exemplo; senão, PT → digitar EN) ===== */
function writeItem(t){
  const cands=[...alts(t.en.replace(/\(.*?\)/g,"")),...alts(t.syn)];
  if(t.exEn){const low=t.exEn.toLowerCase();
    for(const c of cands.slice().sort((a,b)=>b.length-a.length)){
      for(const v of [c,c.replace(/^to /i,""),c.replace(/s$/,""),c+"s"]){const p=low.indexOf(v.toLowerCase());
        if(p>=0&&v.length>3&&!/[a-z]/i.test(low[p-1]||"")&&!/[a-z]/i.test(low[p+v.length]||""))return{...t,cloze:true,pos:p,len:v.length,word:t.exEn.substr(p,v.length),cands}}}}
  return{...t,cloze:false,cands};
}
let wq=[],wk=0,wScore=0;
function renderEscrever(fresh){
  if(fresh||!wq.length){const g=G();const weak=g.filter(t=>boxOf(t.i)<3);wq=shuffle(weak.length>=12?weak:g).slice(0,12).map(writeItem);wk=0;wScore=0}
  const el=$("#p-escrever");
  if(wk>=wq.length){
    el.innerHTML=`<div class="sheet done"><span class="counter">RODADA CONCLUÍDA</span><div class="big">${wScore}/${wq.length}</div><p class="hint">Os erros foram para a caixa "não sabia" dos flashcards.</p><button class="btn primary" id="wAgain">Nova rodada</button></div>`;
    $("#wAgain").onclick=()=>renderEscrever(true);return;
  }
  const t=wq[wk];
  el.innerHTML=`<p class="hint">Escreva o termo em inglês. Quando o termo tem frase de exemplo, ele aparece como lacuna. Erros pequenos de digitação são aceitos e sinalizados. Prioriza termos que você ainda não domina.</p>
  <span class="counter">${wk+1} DE ${wq.length} · ACERTOS ${wScore}</span>
  <div class="sheet panel">${t.cloze
    ?`<p class="cloze">${esc(t.exEn.slice(0,t.pos))}<span class="gap" id="gap">&nbsp;</span>${esc(t.exEn.slice(t.pos+t.len))}</p><p class="hint">${esc(t.exPt||t.pt)}</p>`
    :`<span class="counter">COMO SE DIZ EM INGLÊS</span><p class="q">${esc(t.pt)}</p>`}</div>
  <div class="row"><input type="text" id="wIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="termo em inglês" style="flex:1;min-width:0"><button class="btn primary" id="wChk">Conferir</button></div>
  <div id="wFb" class="feedback"></div>`;
  const inp=$("#wIn");inp.focus({preventScroll:true});
  const check=()=>{
    if($("#wChk").dataset.next){wk++;renderEscrever();return}
    const res=judge(inp.value,t.cloze?[...t.cands,t.word]:t.cands);
    if(res){wScore++;D().box[t.i]=Math.max(boxOf(t.i),2)}else D().box[t.i]=1;
    save();renderStats();
    if(t.cloze)$("#gap").textContent=t.word;
    $("#wFb").innerHTML=`<span class="${res?"ok":"no"}">${res===2?"Correto.":res===1?"Correto, com erro de digitação.":"Resposta esperada:"}</span> <b>${esc(t.en)}</b>${t.syn?` <span class="hint">· ${esc(t.syn)}</span>`:""}${res!==2&&inp.value?`<br><span class="hint">Você escreveu: ${esc(inp.value)}</span>`:""}${t.note?`<div class="note" style="margin-top:10px"><b>Atenção</b>${esc(t.note)}</div>`:""}`;
    $("#wChk").textContent="Próxima →";$("#wChk").dataset.next=1;inp.disabled=true;$("#wChk").focus();
  };
  $("#wChk").onclick=check;inp.onkeydown=e=>{if(e.key==="Enter")check()};
}

/* ===== Quiz ===== */
let qz=[],qk=0,qScore=0,qWrong=[],qFull=true;
function newQuiz(pool){
  const all=ALL(),g=G();qFull=!pool;pool=pool||shuffle(g).slice(0,10);
  const label=(o,dir)=>dir==="pt"?head(o.en):o.pt.replace(/\s*\(.*\)/,"");
  qz=pool.map(t=>{const dir=Math.random()<.6?"pt":"en";
    const ans=label(t,dir);
    const same=shuffle(all.filter(o=>o.i!==t.i&&o.sec===t.sec&&label(o,dir).toLowerCase()!==ans.toLowerCase()));
    const rest=shuffle(all.filter(o=>o.i!==t.i&&o.sec!==t.sec&&label(o,dir).toLowerCase()!==ans.toLowerCase()));
    const others=[...same,...rest].filter((o,ix,arr)=>arr.findIndex(z=>label(z,dir)===label(o,dir))===ix).slice(0,3);
    return{t,dir,prompt:dir==="pt"?t.pt:head(t.en),opts:shuffle([t,...others]).map(o=>({i:o.i,txt:label(o,dir)}))}});
  qk=0;qScore=0;qWrong=[];
}
function renderQuiz(fresh){
  if(fresh||!qz.length)newQuiz();
  const el=$("#p-quiz"),d=D();
  if(qk>=qz.length){
    if(qFull&&qz.length===10&&(d.quizBest==null||qScore>d.quizBest)){d.quizBest=qScore;save();renderStats()}
    el.innerHTML=`<div class="sheet done"><span class="counter">RESULTADO</span><div class="big">${qScore}/${qz.length}</div>
    <p class="hint">${qWrong.length?"Termos errados: "+qWrong.map(t=>esc(t.pt)).join(", ")+".":"Sem erros nesta rodada."}</p>
    <div class="row">${qWrong.length?`<button class="btn primary" id="qRetry">Refazer só os erros</button>`:""}<button class="btn" id="qNew">Novo quiz de 10</button></div></div>`;
    $("#qNew").onclick=()=>renderQuiz(true);
    if(qWrong.length)$("#qRetry").onclick=()=>{newQuiz(shuffle(qWrong));renderQuiz()};
    return;
  }
  const q=qz[qk];
  el.innerHTML=`<p class="hint">Escolha a tradução correta. As alternativas erradas saem da mesma seção sempre que possível, então são parecidas com a resposta.</p>
  <span class="counter">QUESTÃO ${qk+1} DE ${qz.length} · ${q.dir==="pt"?"PT → EN":"EN → PT"} · ACERTOS ${qScore}</span>
  <div class="sheet panel"><p class="q">${esc(q.prompt)}</p>
  <div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-i="${o.i}">${String.fromCharCode(65+j)}) ${esc(o.txt)}</button>`).join("")}</div>
  <div id="qFb" class="feedback"></div></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(el.querySelector(".opt.right"))return;
    const ok=+b.dataset.i===q.t.i;
    el.querySelectorAll(".opt").forEach(x=>{if(+x.dataset.i===q.t.i)x.classList.add("right");x.disabled=true});
    if(ok){qScore++;D().box[q.t.i]=Math.max(boxOf(q.t.i),2)}else{b.classList.add("wrong");qWrong.push(q.t);D().box[q.t.i]=1}
    save();renderStats();
    $("#qFb").innerHTML=`<p><b>${esc(q.t.pt)}</b> → ${esc(q.t.en)}</p>${q.t.exEn?`<p class="ex">${esc(q.t.exEn)}</p>`:""}${q.t.note?`<div class="note"><b>Atenção</b>${esc(q.t.note)}</div>`:""}<div class="row" style="margin-top:12px"><button class="btn primary" id="qNext">${qk+1<qz.length?"Próxima →":"Ver resultado"}</button></div>`;
    $("#qNext").onclick=()=>{qk++;renderQuiz()};$("#qNext").focus();
  });
}

/* ===== Glossário ===== */
function renderGloss(){
  const el=$("#p-glossario"),m=M(),g=G();
  el.innerHTML=`${m.notes.length?`<details class="sheet" open><summary>Notas do material (${m.notes.length})</summary><ul class="notes">${m.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></details>`:""}
  <div class="row"><input type="text" id="gq" placeholder="Buscar em português ou inglês" style="flex:1;min-width:0"><span class="counter">FONTE: ${esc(m.source)}</span></div>
  <div class="tbl"><table><thead><tr><th>#</th><th>Português</th><th>Inglês e observações</th><th>Exemplo</th></tr></thead><tbody id="gb"></tbody></table></div>`;
  const draw=q=>{q=norm(q||"");let last=-1;$("#gb").innerHTML=g.filter(t=>!q||norm(t.pt+" "+t.en+" "+t.syn).includes(q)).map(t=>{
    const sec=(m.sections.length>1&&t.sec!==last)?`<tr class="sec"><td colspan="4">${esc(m.sections[t.sec])}</td></tr>`:"";last=t.sec;
    return sec+`<tr><td class="n">${t.i+1}</td>
    <td><div class="pt">${esc(t.pt)}</div><div class="lv"><span class="dot" style="background:${BOX_COL[Math.min(4,boxOf(t.i))]}"></span>${BOX_LBL[Math.min(4,boxOf(t.i))]}</div></td>
    <td><b>${esc(t.en)}</b>${t.syn?`<div class="hint">${esc(t.syn)}</div>`:""}${t.info?`<div class="hint">${esc(t.info)}</div>`:""}${t.note?`<div class="note" style="margin-top:8px"><b>Atenção</b>${esc(t.note)}</div>`:""}</td>
    <td>${t.exEn?`<i style="font-family:var(--f-display)">${esc(t.exEn)}</i><div class="hint">${esc(t.exPt)}</div>`:""}</td></tr>`}).join("")};
  draw();$("#gq").oninput=e=>draw(e.target.value);
}

/* ===== Boot ===== */
function resetRuns(){cq=[];round={n:0,ok:0,total:0};wq=[];qz=[]}
const sel=$("#modSel");
sel.innerHTML=MODULES.map(m=>`<option value="${m.id}">${esc(m.title)}</option>`).join("");
sel.value=M().id;
sel.onchange=()=>{S.mod=sel.value;save();resetRuns();$("#modTitle").textContent=M().title;fillSections();renderStats();setTab(S.tab==="cards"||S.tab==="glossario"||S.tab==="quiz"||S.tab==="escrever"?S.tab:"versao")};
$("#secSel").onchange=e=>{D().sec=+e.target.value;save();resetRuns();setTab(S.tab)};
$("#modTitle").textContent=M().title;
fillSections();renderStats();setTab(S.tab);
</script>
